:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0a1118; --bg-grad:#0d1821; --surface:#111b25; --surface-2:#16222e; --surface-3:#1c2a37;
  --ink:#e8eef4; --ink-2:#c8d3de; --muted:#93a3b4; --faint:#6c7d8f; --line:#213040; --line-2:#2c3d4f; --field:#0f1922;
  --teal:#2fb3a8; --teal-2:#3cc5b9; --teal-soft:rgba(47,179,168,.14); --blue:#6aa6ee; --blue-2:#82b6f3; --blue-soft:rgba(106,166,238,.14);
  --violet:#a594f2; --violet-2:#b6a8f6; --violet-soft:rgba(165,148,242,.15);
  --ok:#4cc98a; --ok-soft:rgba(76,201,138,.13); --warn:#f0a54a; --warn-soft:rgba(240,165,74,.13); --bad:#f27b70; --bad-soft:rgba(242,123,112,.13);
  --on-accent:#06141a; --scrim:rgba(0,0,0,.6);
  --shadow-1:0 1px 0 rgba(255,255,255,.02);
  --shadow-2:0 1px 0 rgba(255,255,255,.03),0 10px 30px rgba(0,0,0,.35);
  --shadow-3:0 16px 48px rgba(0,0,0,.55);
  --c-req:#3cc5b9; --c-inc:#b6a8f6; --c-wait:#82b6f3; --grid:#223243;
  --hero-fade:#111b25;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:calc(16px * var(--fs,1.12))}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.6;
  background:radial-gradient(1200px 380px at 50% -120px,var(--bg-grad),transparent 70%) no-repeat,var(--bg);min-height:100vh}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.3;font-weight:700;letter-spacing:-.005em}
h2{font-size:1.25rem} h3{font-size:1.02rem}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.muted{color:var(--muted)} .small{font-size:.85rem}
button,input,select{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
a{color:var(--blue)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- app bar ---------- */
.appbar{position:sticky;top:0;z-index:25;background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);
  border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.appbar-in{max-width:1040px;margin:0 auto;height:var(--bar-h);display:flex;align-items:center;gap:12px;
  padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.brand{display:flex;gap:10px;align-items:center;min-width:0;flex:1}
.logo{width:56px;height:56px;border-radius:50%;flex:none;box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--line);image-rendering:auto}
@media (max-width:420px){.logo{width:50px;height:50px}}
.brand h1{font-size:1.12rem;line-height:1.2;white-space:nowrap}
.brand .org{font-size:.72rem;color:var(--muted);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand>div{min-width:0}
.iconbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink-2);flex:none;transition:background .2s,transform .1s}
.iconbtn svg{width:21px;height:21px}
.iconbtn:active{transform:scale(.94)}
.iconbtn .txt{font-weight:700;font-size:.95rem;letter-spacing:-.02em}
.mode-pill{display:none}

/* ---------- bottom tab bar ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:26;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:saturate(1.4) blur(16px);-webkit-backdrop-filter:saturate(1.4) blur(16px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar-in{max-width:560px;margin:0 auto;height:var(--nav-h);display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--faint);font-size:.74rem;font-weight:600;cursor:pointer;padding:8px 0;height:100%;justify-content:center;position:relative}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--teal)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--teal)}
.tab.scan{color:var(--ink-2)}
.tab.scan .ring{width:60px;height:60px;border-radius:50%;margin-top:-30px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(160deg,var(--teal-2),var(--teal));box-shadow:0 8px 20px color-mix(in srgb,var(--teal) 45%,transparent),0 0 0 5px var(--bg)}
.tab.scan .ring svg{width:28px;height:28px}
.tab.scan:active .ring{transform:scale(.94)}

main{padding:18px max(16px,env(safe-area-inset-right,0px)) calc(var(--nav-h) + 110px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
body.noNav main{padding-bottom:60px}
.col{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.wide{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:20px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow-1)}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:6px 2px -4px}
.section-h h3{font-size:.95rem;color:var(--ink-2)}
.eyebrow{font-size:.75rem;font-weight:600;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}

/* ---------- form ---------- */
.form{display:flex;flex-direction:column;gap:18px}
.field{display:flex;flex-direction:column;gap:7px}
.field label,.field .lab{font-weight:600;font-size:.95rem;color:var(--ink)}
.step{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:8px;background:var(--surface-3);color:var(--ink-2);font-size:.78rem;font-weight:700;margin-right:8px;vertical-align:1px}
.hint.warn-t{color:var(--warn,#b45309);font-weight:600}
.hint{font-size:.8rem;color:var(--muted)}
.input{width:100%;min-height:54px;padding:13px 16px;border:1.5px solid var(--line-2);border-radius:var(--r-m);background:var(--field);font-size:1.05rem;min-width:0;
  transition:border-color .15s,box-shadow .15s,background .15s}
.input::placeholder{color:var(--faint)}
.input:focus{border-color:var(--blue);background:var(--surface);outline:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--blue) 18%,transparent)}
.input.bad{border-color:var(--bad);background:var(--bad-soft)}
.input.static{background:var(--surface-3);color:var(--ink-2);border-color:transparent;display:flex;align-items:center}
.daychips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:var(--surface-3);padding:5px;border-radius:var(--r-m)}
.daychip{border:0;background:none;border-radius:11px;padding:12px 6px;font-weight:600;font-size:1rem;cursor:pointer;color:var(--muted);transition:background .2s,color .2s,box-shadow .2s}
.daychip[aria-pressed="true"]{background:var(--surface);color:var(--teal);box-shadow:var(--shadow-1),0 0 0 1px var(--line)}
.timein{font-size:1.4rem;letter-spacing:.1em;max-width:220px}
.timein::placeholder{letter-spacing:.02em;font-size:1rem}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.scanrow{display:flex;gap:8px}.scanrow .input{flex:1}
.cam{flex:none;width:58px;border-radius:var(--r-m);border:0;cursor:pointer;display:grid;place-items:center;color:#fff;background:linear-gradient(160deg,var(--blue-2),var(--blue));box-shadow:0 4px 12px color-mix(in srgb,var(--blue) 30%,transparent)}
.cam svg{width:26px;height:26px}
.btn{border:0;border-radius:var(--r-m);padding:13px 18px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;
  transition:transform .1s ease,filter .15s,background .2s,border-color .2s,box-shadow .2s}
.btn:active{transform:scale(.98)}
.btn-teal{background:linear-gradient(160deg,var(--teal-2),var(--teal));color:#fff;box-shadow:0 6px 16px color-mix(in srgb,var(--teal) 28%,transparent)}
.btn-blue{background:linear-gradient(160deg,var(--blue-2),var(--blue));color:#fff;box-shadow:0 6px 16px color-mix(in srgb,var(--blue) 28%,transparent)}
.btn-violet{background:linear-gradient(160deg,var(--violet-2),var(--violet));color:#fff;box-shadow:0 6px 16px color-mix(in srgb,var(--violet) 28%,transparent)}
:root[data-theme="dark"] .btn-teal,:root[data-theme="dark"] .btn-blue,:root[data-theme="dark"] .btn-violet,:root[data-theme="dark"] .cam{color:var(--on-accent)}
.btn-ghost{background:var(--surface);border:1.5px solid var(--line-2);color:var(--ink)}
.btn-soft{background:var(--surface-3);color:var(--ink)}
.btn:disabled{opacity:.6;cursor:wait}
.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.btn:disabled::before{content:"";width:16px;height:16px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;flex:none}
.btn-block{width:100%;padding:16px;font-size:1.05rem;min-height:56px}
.linkbtn{background:none;border:0;color:var(--blue);cursor:pointer;padding:4px 0;font-size:.9rem;font-weight:600;align-self:flex-start}
.opt{font-weight:500;color:var(--faint);font-size:.82rem}
.flags{display:flex;flex-direction:column;gap:6px}
.flag{font-size:.88rem;padding:8px 12px;border-radius:10px;font-weight:500}
.flag.ok{background:var(--ok-soft);color:var(--ok)}.flag.warn{background:var(--warn-soft);color:var(--warn)}.flag.bad{background:var(--bad-soft);color:var(--bad)}
.rule{font-size:.88rem;padding:10px 14px;border-radius:12px;background:var(--blue-soft);color:var(--blue);font-weight:500;display:flex;gap:8px;align-items:flex-start}
.rule::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;flex:none;margin-top:.5em}
.rule.bad{background:var(--bad-soft);color:var(--bad)}.rule.warn{background:var(--warn-soft);color:var(--warn)}
.tag-inc{display:inline-block;font-size:.7rem;font-weight:700;color:var(--violet);background:var(--violet-soft);border-radius:6px;padding:1px 7px;margin-left:6px;white-space:nowrap;vertical-align:2px}
.me{display:flex;justify-content:space-between;gap:10px;align-items:center}
.avatar{width:44px;height:44px;border-radius:14px;background:var(--teal-soft);color:var(--teal);display:grid;place-items:center;font-weight:700;flex:none}
.combo{position:relative}
.combo-list{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);max-height:min(340px,50vh);overflow:auto;z-index:5;box-shadow:var(--shadow-3);padding:6px;margin:0;list-style:none}
.combo-list li{padding:12px 14px;border-radius:10px;cursor:pointer}
.combo-list li.combo-h{padding:8px 14px 4px;font-size:.78rem;font-weight:700;color:var(--muted);cursor:default;background:none!important;letter-spacing:.02em}
.combo-list li[aria-selected="true"],.combo-list li:hover{background:var(--blue-soft)}
.combo-list li.armed{background:color-mix(in srgb,var(--teal) 16%,var(--surface));box-shadow:inset 0 0 0 2px var(--teal);font-weight:600}
.combo-list li.armed::after{content:"✓ " attr(data-hint);display:block;font-size:.78rem;font-weight:700;color:var(--teal);margin-top:3px}

/* ---------- page header (back) ---------- */
.page-head{display:flex;flex-direction:column;align-items:flex-start;gap:14px}
.back-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:999px;padding:9px 18px 9px 10px;font-size:1rem;font-weight:600;cursor:pointer;box-shadow:var(--shadow-1)}
.back-btn svg{width:22px;height:22px}
.back-btn:active{transform:scale(.97)}
.page-head h2{font-size:1.4rem}
.accent-teal{--acc:var(--teal);--acc-soft:var(--teal-soft)}.accent-blue{--acc:var(--blue);--acc-soft:var(--blue-soft)}.accent-violet{--acc:var(--violet);--acc-soft:var(--violet-soft)}
.panel[class*="accent-"]{border-top:4px solid var(--acc)}

/* ---------- home ---------- */
.hero{position:relative;flex-direction:row;align-items:center;min-height:168px;padding:20px;overflow:hidden;border:1px solid var(--line);
  background:linear-gradient(90deg,var(--hero-fade) 0%,var(--hero-fade) 26%,color-mix(in srgb,var(--hero-fade) 55%,transparent) 36%,transparent 50%),var(--hero-img) right center/auto 100% no-repeat,var(--hero-fade)}

/* ================= ธีมเทศกาลลอยกระทง (เปิดอัตโนมัติตามวัน FESTS) ================= */
:root[data-fest] .appbar{box-shadow:inset 0 -3px 0 0 var(--fest-line,#f4c34a)}
:root[data-fest="xmas"]{--fest-line:#d94848}
:root[data-fest="newyear"]{--fest-line:#f4c34a}
:root[data-fest] .hero{background:none;border-color:transparent;min-height:184px;align-items:flex-start;padding:18px 20px}
.fest-scene{position:absolute;inset:0;z-index:0;pointer-events:none}
.fest-scene svg{width:100%;height:100%;display:block}
:root[data-fest] .hero-t{max-width:62%;text-shadow:0 1px 6px rgba(5,10,40,.6);z-index:1}
:root[data-fest] .hero-t .hi{color:#ffe08a;font-weight:700;letter-spacing:.01em}
:root[data-fest] .hero-t .nm{color:#fff}
:root[data-fest] .hero-t .small{color:#d9e2ff!important}
.kt-bob{animation:kt-bob 4.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.kt-bob.d2{animation-delay:-1.6s;animation-duration:5.2s}.kt-bob.d3{animation-delay:-3s;animation-duration:6s}
@keyframes kt-bob{0%,100%{transform:translate(0,0) rotate(-1.5deg)}50%{transform:translate(6px,-2px) rotate(1.5deg)}}
.kt-flame{animation:kt-fl 1.1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes kt-fl{from{transform:scale(1,1);opacity:.95}to{transform:scale(.85,1.12);opacity:.8}}
.kt-glow{animation:kt-gl 3s ease-in-out infinite alternate}@keyframes kt-gl{from{opacity:.55}to{opacity:.9}}
.kt-star{animation:kt-tw 2.6s ease-in-out infinite alternate}@keyframes kt-tw{from{opacity:.25}to{opacity:1}}
/* คริสต์มาส: หิมะตก ไฟต้นคริสต์มาสกะพริบ · ปีใหม่: พลุ */
.xm-snow{animation:xm-fall linear infinite}@keyframes xm-fall{from{transform:translateY(calc(var(--y) * -1px - 10px))}to{transform:translateY(calc(200px - var(--y) * 1px))}}
.xm-bulb{animation:kt-tw 1.2s ease-in-out infinite alternate}
.ny-burst{animation:ny-pop 2.8s ease-out infinite;transform-box:fill-box;transform-origin:center;opacity:0}
@keyframes ny-pop{0%{transform:scale(.2);opacity:0}12%{opacity:1}60%{transform:scale(1);opacity:.9}100%{transform:scale(1.08);opacity:0}}
.ny-spark{animation:kt-tw .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:reduce){.kt-bob,.kt-flame,.kt-glow,.kt-star,.xm-snow,.xm-bulb,.ny-spark{animation:none}.ny-burst{animation:none;opacity:.85}}
:root[data-fest][data-theme="dark"] .hero{background:none;border-color:rgba(255,224,138,.25)}
:root[data-fest][data-theme="dark"] .hero-t{flex-direction:column;align-items:flex-start;max-width:62%;text-shadow:0 1px 6px rgba(5,10,40,.6)}
:root[data-fest][data-theme="dark"] .hero-t .hi{color:#ffe08a}
:root[data-fest][data-theme="dark"] .hero-t .nm{color:#fff;font-size:1.55rem}
:root[data-fest][data-theme="dark"] .hero-t .small{color:#d9e2ff;opacity:1}
:root[data-fest-tone="light"] .hero-t{text-shadow:0 0 8px rgba(255,255,255,.9),0 0 2px #fff}
:root[data-fest-tone="light"] .hero-t .hi,:root[data-fest-tone="light"][data-theme="dark"] .hero-t .hi{color:var(--fest-accent,#0b74b8)}
:root[data-fest-tone="light"] .hero-t .nm,:root[data-fest-tone="light"][data-theme="dark"] .hero-t .nm{color:#10233a}
:root[data-fest-tone="light"] .hero-t .small,:root[data-fest-tone="light"][data-theme="dark"] .hero-t .small{color:#3b4a5c!important}
:root[data-fest-tone="light"] .fest-chip{background:rgba(255,255,255,.75);border-color:color-mix(in srgb,var(--fest-accent) 45%,transparent);color:var(--fest-accent)}
:root[data-fest] .appbar{box-shadow:inset 0 -3px 0 0 var(--fest-accent,#f4c34a)}
:root[data-fest] svg.bot{overflow:visible}
.fest-list{display:grid;gap:8px;max-height:52vh;overflow:auto;padding:2px}
.fest-opt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:12px 14px;border-radius:var(--r-m);border:2px solid var(--line-2);background:var(--surface);color:var(--ink);cursor:pointer;font:inherit}
.fest-opt span{font-size:.85rem;color:var(--muted)}
.fest-opt[aria-pressed="true"]{border-color:var(--teal);background:color-mix(in srgb,var(--teal) 10%,var(--surface))}
.fest-opt[aria-pressed="true"] b::after{content:"  ✓ ใช้อยู่";color:var(--teal);font-size:.85rem}
.cam-card{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--r-l);background:color-mix(in srgb,var(--teal) 9%,var(--surface));border:1.5px solid color-mix(in srgb,var(--teal) 40%,var(--line))}
.cam-card[hidden]{display:none}
.cam-i{font-size:1.6rem;flex-shrink:0}.cam-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.cam-b span{color:var(--muted)}
.cam-card .btn{flex-shrink:0;min-height:44px;padding:8px 14px}
.cam-steps{margin:6px 0 4px 1.2em;display:grid;gap:8px;line-height:1.5}
@media (max-width:380px){.cam-card{flex-wrap:wrap}.cam-card .btn{width:100%}}
.sh-open{margin-top:6px;font-size:.88rem}
.sh-box{margin-top:8px;padding:12px;border-radius:var(--r-m);border:1.5px dashed var(--line-2);background:var(--surface-2);display:grid;gap:10px}
.sh-warn{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:8px 10px;font-size:.9rem}
.sh-days{display:flex;flex-wrap:wrap;gap:6px}
.sh-day{border:1.5px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:12px;padding:8px 10px;font:inherit;font-size:.9rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.2;min-width:62px}
.sh-day small{font-size:.7rem;color:var(--muted)}
.sh-day[aria-pressed="true"]{border-color:var(--teal);background:color-mix(in srgb,var(--teal) 14%,var(--surface));font-weight:700}
.sh-other{position:relative;overflow:hidden}.sh-other input{position:absolute;inset:0;opacity:0;cursor:pointer}
.sh-row{display:flex;gap:8px;align-items:center}
.sh-pre{font-size:1.25rem;font-weight:700;letter-spacing:.04em;padding:10px 12px;border-radius:10px;background:var(--surface);border:1.5px solid var(--line);white-space:nowrap}
.sh-pre i{font-style:normal;color:var(--teal)}
.sh-last{flex:1;min-width:0;font-size:1.25rem;letter-spacing:.12em}
.fest-chip{display:inline-flex;white-space:nowrap;align-items:center;gap:6px;margin-top:8px;align-self:flex-start;background:rgba(255,224,138,.16);border:1px solid rgba(255,224,138,.55);color:#ffe08a;border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:600}

.hero-t{flex:1;min-width:0;max-width:42%;text-shadow:0 0 8px var(--hero-fade),0 0 2px var(--hero-fade);display:flex;flex-direction:column;gap:2px;position:relative}
.hero-t .hi{font-size:.85rem;color:var(--muted);font-weight:500}
.hero-t .nm{font-size:1.55rem;font-weight:700;line-height:1.2}
.hero-t .small{line-height:1.45;margin-top:4px}
.hero-t .linkbtn{margin-top:6px;font-size:.85rem}
.big-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big{position:relative;overflow:hidden;border:0;border-radius:var(--r-l);padding:18px 16px;cursor:pointer;display:flex;flex-direction:column;gap:10px;align-items:flex-start;text-align:left;min-height:150px;color:#fff;
  box-shadow:0 10px 24px -8px color-mix(in srgb,var(--c) 60%,transparent);background:linear-gradient(155deg,var(--c2),var(--c));transition:transform .12s,box-shadow .2s}
.big::after{content:"";position:absolute;inset:auto -40px -60px auto;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.18),transparent 70%);pointer-events:none}
.big:active{transform:scale(.97)}
.big svg{box-sizing:content-box;width:26px;height:26px;padding:10px;border-radius:14px;background:rgba(255,255,255,.18);flex:none}
.big b{font-size:1.12rem;line-height:1.3}
.big span{font-size:.82rem;opacity:.92;line-height:1.45}
.big .go{position:absolute;right:14px;top:16px;width:22px;height:22px;padding:0;background:none;opacity:.7}
.big.send{--c:#0a6f6a;--c2:#13a097}.big.recv{--c:#1a5196;--c2:#3a7fd3}.big.inc{--c:#4a3896;--c2:#7360cf}
.big.inc{grid-column:1/-1;min-height:0;flex-direction:row;align-items:center;gap:14px;padding:16px}
.big.inc .t{display:flex;flex-direction:column;gap:2px}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.help-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:13px 10px;font-weight:600;color:var(--ink);cursor:pointer;box-shadow:var(--shadow-1);font-size:.95rem}
.help-btn svg{width:20px;height:20px;color:var(--blue)}
.help-btn:active{transform:scale(.98)}

/* โหมดมืด: ภาพเต็มการ์ด ตัวหนังสือเรียงแนวนอน สีเกือบดำบนภาพสว่าง */
:root[data-theme="dark"] .hero{background:var(--hero-img) 62% 42%/cover no-repeat;min-height:178px;align-items:flex-start;padding:18px 20px;border-color:transparent}
:root[data-theme="dark"] .hero-t{max-width:100%;flex-direction:row;flex-wrap:wrap;align-items:baseline;column-gap:10px;row-gap:0;text-shadow:0 0 12px rgba(255,255,255,.95),0 0 3px rgba(255,255,255,.9)}
:root[data-theme="dark"] .hero-t .hi,:root[data-theme="dark"] .hero-t .nm,:root[data-theme="dark"] .hero-t .small{color:#0b0f14}
:root[data-theme="dark"] .hero-t .nm{font-size:1.45rem}
:root[data-theme="dark"] .hero-t .hi{font-size:1rem;font-weight:600}
:root[data-theme="dark"] .hero-t .small{flex-basis:100%;font-weight:500;opacity:.85}
/* live: ใบตามที่รอรับของฉัน */
.live{display:flex;flex-direction:column;gap:12px}
.live-h{display:flex;align-items:center;gap:10px;justify-content:space-between}
.live-h .ttl{display:flex;align-items:center;gap:10px}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 0 color-mix(in srgb,var(--teal) 60%,transparent)}
.lr{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:12px;border-radius:var(--r-m);background:var(--surface-2);border:1px solid var(--line);cursor:pointer;text-align:left;width:100%;color:var(--ink)}
.lr:active{transform:scale(.99)}
.ring2{--p:0;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;flex:none;
  background:conic-gradient(var(--rc,var(--teal)) calc(var(--p)*1%),var(--surface-3) 0)}
.ring2>span{width:42px;height:42px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-weight:700;font-size:.78rem;line-height:1.05;text-align:center;font-variant-numeric:tabular-nums}
.ring2>span small{display:block;font-size:.6rem;font-weight:600;color:var(--muted)}
.lr.ready{border-color:color-mix(in srgb,var(--ok) 45%,var(--line));background:var(--ok-soft)}
.lr.ready .ring2{--rc:var(--ok)}
.lr.ready .ring2>span{background:var(--ok-soft);color:var(--ok)}
.lr .meta{min-width:0;display:flex;flex-direction:column;gap:1px}
.lr .meta b{font-family:var(--f-mono);font-size:1rem}
.lr .meta .small{line-height:1.4}
.lr .state{font-size:.8rem;font-weight:700;color:var(--muted);text-align:right;white-space:nowrap}
.lr.ready .state{color:var(--ok)}
.notif{display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--muted)}
.switch{position:relative;width:44px;height:26px;border-radius:999px;background:var(--line-2);border:0;cursor:pointer;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--teal)}.switch[aria-checked="true"]::after{transform:translateX(18px)}

/* timeline list */
.mylist{display:flex;flex-direction:column}
.mylist .it{display:grid;grid-template-columns:14px 1fr auto;gap:12px;padding:12px 0;align-items:start;position:relative}
.mylist .it::before{content:"";width:10px;height:10px;border-radius:50%;margin-top:.55em;background:var(--dotc,var(--warn));box-shadow:0 0 0 4px color-mix(in srgb,var(--dotc,var(--warn)) 18%,transparent)}
.mylist .it.out{--dotc:var(--ok)}
.mylist .it+.it{border-top:1px dashed var(--line)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:.76rem;font-weight:700;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-in{background:var(--warn-soft);color:var(--warn)}.st-out{background:var(--ok-soft);color:var(--ok)}

/* ---------- cards ---------- */
.check{border:1.5px solid var(--line);border-radius:var(--r-l);padding:18px;display:flex;flex-direction:column;gap:12px;background:var(--surface)}
.check.ok{border-color:var(--blue);box-shadow:0 0 0 4px var(--blue-soft)}
.ward-big{font-size:1.5rem;font-weight:700;line-height:1.2}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:.95rem;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.dupcard{border:1.5px solid color-mix(in srgb,var(--warn) 55%,transparent);background:var(--warn-soft);border-radius:var(--r-l);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.dupcard h3{color:var(--warn)}.dupcard .kv dd{font-weight:600}
.pending{border:1.5px solid color-mix(in srgb,var(--blue) 55%,transparent);background:var(--blue-soft);border-radius:var(--r-l);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.pending h3{color:var(--blue)}.pending .kv dd{font-weight:600}
.res{border:1px solid var(--line);border-left:5px solid var(--warn);border-radius:var(--r-m);padding:14px 16px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.res.out{border-left-color:var(--ok)}
.res .big-st{font-weight:700;font-size:1.05rem;color:var(--warn)}.res.out .big-st{color:var(--ok)}
.alert.paper{display:flex;gap:12px;align-items:flex-start;background:var(--warn-soft);color:var(--ink,inherit);border:1.5px solid color-mix(in srgb,var(--warn) 45%,transparent);margin-bottom:6px}
.alert.paper b{color:var(--warn);display:block;margin-bottom:2px}
.alert.paper svg{width:26px;height:26px;flex-shrink:0;color:var(--warn);margin-top:2px}
.confirm-paper{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:var(--r-m);border:2px solid var(--line-2);background:var(--surface);cursor:pointer;font-size:1rem;line-height:1.5}
.confirm-paper input{width:26px;height:26px;flex-shrink:0;margin:0;accent-color:var(--teal)}
.confirm-paper:has(input:checked){border-color:var(--teal);background:color-mix(in srgb,var(--teal) 8%,var(--surface))}
.confirm-paper.need{border-color:var(--bad);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){.confirm-paper.need{animation:none}}
.btn[aria-disabled="true"].btn-teal{opacity:.55}
.alert{padding:13px 15px;border-radius:var(--r-m);font-size:.93rem;white-space:pre-line;font-weight:500}
.alert.bad{background:var(--bad-soft);color:var(--bad)}.alert.warn{background:var(--warn-soft);color:var(--warn)}.alert.ok{background:var(--ok-soft);color:var(--ok)}.alert.info{background:var(--blue-soft);color:var(--blue)}

/* ---------- done + undo ---------- */
.done{text-align:center;align-items:center;padding-top:28px}
.tick{width:84px;height:84px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;position:relative}
.tick::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid color-mix(in srgb,var(--ok) 25%,transparent)}
.tick svg{width:40px;height:40px}
.tick path{stroke-dasharray:30;stroke-dashoffset:0}
.time{font-family:var(--f-mono);font-size:2rem;font-weight:500;letter-spacing:.02em;line-height:1.1}
.receipt{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-m);padding:14px 16px;text-align:left}
.undo{width:100%;display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--surface);border-radius:var(--r-m);padding:10px 10px 10px 16px;font-size:.92rem;position:relative;overflow:hidden}
.undo .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--teal-2);width:100%;transform-origin:left}
.undo span{flex:1;text-align:left}
.undo button{border:0;border-radius:10px;background:color-mix(in srgb,var(--surface) 16%,transparent);color:inherit;font-weight:700;padding:9px 14px;cursor:pointer}
.next-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}

/* ---------- empty/illustration ---------- */
.art{width:120px;margin:0 auto}.art.sm{width:84px}
.art svg{display:block;width:100%;height:auto;overflow:hidden}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:8px 0}
.empty .art{width:130px}
.sk{background:linear-gradient(90deg,var(--surface-3) 25%,var(--surface-2) 40%,var(--surface-3) 60%);background-size:300% 100%;border-radius:12px}
.sk-row{height:52px;margin:6px 0}
.loading{text-align:center;color:var(--muted);padding:60px 0}

/* ---------- toast / sheet / modal ---------- */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:12px 18px;border-radius:14px;font-size:.92rem;z-index:60;max-width:calc(100% - 32px);box-shadow:var(--shadow-3);font-weight:500}
body.noNav .toast{bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.sheet-ov{position:fixed;inset:0;z-index:55;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;background:var(--surface);border-radius:var(--r-xl) var(--r-xl) 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow-3);max-height:88vh;overflow:auto;display:flex;flex-direction:column;gap:14px}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line-2);margin:4px auto 2px}
.sheet h2{font-size:1.2rem}
.menu-list{display:flex;flex-direction:column;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden}
.menu-it{display:flex;align-items:center;gap:14px;padding:15px 16px;border:0;background:none;width:100%;text-align:left;cursor:pointer;color:var(--ink);font-weight:600;font-size:1rem}
.menu-it+.menu-it{border-top:1px solid var(--line)}
.menu-it svg{width:22px;height:22px;color:var(--muted);flex:none}
.menu-it .r{margin-left:auto;font-weight:500;color:var(--muted);font-size:.88rem}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface-3);border-radius:12px;padding:4px}
.seg3 button{border:0;background:none;border-radius:9px;padding:10px 4px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg3 button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1),0 0 0 1px var(--line)}
.modal{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:center;justify-content:center;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal-box{position:relative;background:var(--surface);border-radius:var(--r-xl);width:100%;max-width:480px;max-height:100%;overflow:auto;box-shadow:var(--shadow-3)}
.modal-x{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;border:0;background:var(--surface-3);color:var(--ink);font-size:1.2rem;line-height:1;cursor:pointer;display:grid;place-items:center;z-index:2}
.modal-head{background:linear-gradient(150deg,var(--teal-2),var(--teal));color:#fff;padding:24px 58px 20px 22px;border-radius:var(--r-xl) var(--r-xl) 0 0}
.modal-head h2{font-size:1.25rem}.modal-head p{margin:4px 0 0;font-size:.88rem;opacity:.9}
.modal-head.help{background:linear-gradient(150deg,#22364d,#0e1b2a)}
.modal-body{padding:20px 22px 22px;display:flex;flex-direction:column;gap:16px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;counter-reset:st}
.steps li{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;counter-increment:st}
.steps li::before{content:counter(st);width:34px;height:34px;border-radius:11px;background:var(--teal-soft);color:var(--teal);font-weight:700;display:grid;place-items:center}
.steps b{display:block}.steps .small{color:var(--muted)}
.help-sec{border:1px solid var(--line);border-radius:var(--r-m);padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--surface-2)}
.help-sec h3{display:flex;align-items:center;gap:8px}
.dot{width:12px;height:12px;border-radius:4px;flex:none}
.help-sec ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:.92rem}
.ios-steps{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.ios-steps li{display:flex;gap:12px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-m);padding:12px 14px}
.ios-steps .n{width:30px;height:30px;border-radius:9px;background:var(--teal-soft);color:var(--teal);font-weight:700;display:grid;place-items:center;flex:none}

/* ---------- scanner ---------- */
.scan-ov{position:fixed;inset:0;background:#05090e;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:16px;color:#fff}
.scan-ov .scan-top{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;font-weight:600}
.scan-ov .scan-top .ttl{font-size:1.05rem}
@keyframes pulse-b{0%,100%{box-shadow:0 0 0 0 rgba(76,201,138,.7)}50%{box-shadow:0 0 0 10px rgba(76,201,138,0)}}
.photo-btn.pulse{animation:pulse-b 1.4s infinite;background:#22a06b;color:#fff;border-color:#22a06b}
@media (prefers-reduced-motion:reduce){.photo-btn.pulse{animation:none}}
#reader{width:min(100%,480px);border-radius:20px;overflow:hidden;background:#000;box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.scan-ov .msg{text-align:center;font-size:.95rem;max-width:420px;opacity:.9}
.scan-ov .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.scan-ov .btn-ghost{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.22);color:#fff}
.zoom{display:flex;align-items:center;gap:10px;width:min(100%,480px);font-size:.9rem}
.zoom input{flex:1;accent-color:#5ff0de;height:28px}
.photo-btn{background:#fff;color:#0e1b2a}
.scan-ov.hit #reader{box-shadow:0 0 0 4px #4cc98a}
.shot-wrap{position:relative;width:min(100%,480px);border-radius:20px;overflow:hidden;background:#000;aspect-ratio:3/4;max-height:62vh}
.shot-wrap video{width:100%;height:100%;object-fit:cover;display:block}
.shot-frame{position:absolute;inset:8%;border:2px dashed rgba(255,255,255,.7);border-radius:14px;pointer-events:none}
.shot-btn{width:74px;height:74px;border-radius:50%;border:5px solid #fff;background:#fff;box-shadow:inset 0 0 0 4px #05090e;cursor:pointer;flex-shrink:0}
.shot-btn:active{transform:scale(.92)}.shot-btn:disabled{opacity:.4}
#shot-ov.hit .shot-wrap{box-shadow:0 0 0 4px #4cc98a}
button.photo-take{width:100%;font:inherit;cursor:pointer}

/* ---------- น้องสไลด์ ---------- */
.guide-top{display:flex;gap:12px;align-items:flex-end;padding:22px 58px 0 18px;background:linear-gradient(180deg,var(--teal-soft),var(--surface));border-radius:var(--r-xl) var(--r-xl) 0 0}
.guide-top .bot{width:96px;flex:none}
.guide-top .say{position:relative;background:var(--surface);border:1.5px solid var(--teal);border-radius:16px 16px 16px 4px;padding:10px 12px;font-size:.92rem;line-height:1.5;margin-bottom:40px}
.guide-top .say b{color:var(--teal);font-size:1.05rem;display:block}
.bot{display:block;height:auto}
.fab{position:fixed;right:calc(10px + env(safe-area-inset-right,0px));bottom:calc(var(--nav-h) + 10px + env(safe-area-inset-bottom,0px));display:flex;align-items:flex-end;gap:4px;z-index:20;pointer-events:none}
.fab>*{pointer-events:auto}
.fab-say.quiet{display:none}
.fab-say{background:var(--surface);border:1.5px solid var(--teal);color:var(--ink);font-weight:600;font-size:.85rem;padding:7px 12px;border-radius:14px 14px 4px 14px;box-shadow:var(--shadow-2);margin-bottom:44px;max-width:190px;cursor:pointer}
.fab-bot{border:0;background:none;padding:0;cursor:pointer;width:64px}
.fab-bot .bot{width:100%;filter:drop-shadow(0 6px 10px rgba(14,27,42,.22))}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:8px;align-items:flex-end}
.msg .av{width:40px;flex:none}
.msg .txt{background:var(--teal-soft);border-radius:16px 16px 16px 4px;padding:10px 13px;font-size:.93rem;line-height:1.6;white-space:pre-line}
.msg.me{justify-content:flex-end}
.msg.me .txt{background:var(--blue);color:#fff;border-radius:16px 16px 4px 16px}
.msg .go{margin-top:8px}
.chips{display:flex;flex-direction:column;gap:6px}
.chips h4{margin:6px 0 0;font-size:.78rem;color:var(--muted);font-weight:600;letter-spacing:.02em}
.chip{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 13px;font-size:.92rem;cursor:pointer;color:var(--ink)}
.chip:hover{border-color:var(--teal);background:var(--teal-soft)}
.call{display:inline-block;font-family:var(--f-mono);font-weight:600;color:var(--teal)}

/* ---------- photo evidence ---------- */
.photo-box{display:flex;flex-direction:column;gap:8px}
.photo-take{display:flex;align-items:center;justify-content:center;gap:10px;border:1.5px dashed var(--line-2);border-radius:var(--r-m);padding:18px;background:var(--surface-2);color:var(--blue);font-weight:600;cursor:pointer;text-align:center}
.photo-take svg{width:26px;height:26px;flex:none}
.photo-prev{display:flex;gap:12px;align-items:center}
.photo-prev img{width:96px;height:96px;object-fit:cover;border-radius:12px;border:1px solid var(--line);flex:none}

/* ---------- lab ---------- */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:560px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:14px 16px;cursor:pointer;text-align:left;box-shadow:var(--shadow-1);transition:border-color .2s,box-shadow .2s}
.stat[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.stat .n{font-size:1.9rem;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}.stat .l{font-size:.82rem;color:var(--muted)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.toolbar .input{max-width:340px}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--shadow-1)}
table{border-collapse:collapse;width:100%;min-width:880px;font-size:.9rem}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.74rem;letter-spacing:.04em;color:var(--muted);font-weight:600;background:var(--surface-2);position:sticky;top:0}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
.late{color:var(--bad);font-weight:700}
.ltabs{display:flex;gap:4px;background:var(--surface-3);border-radius:14px;padding:4px;align-self:flex-start;max-width:100%;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.ltabs::-webkit-scrollbar{display:none}
.photo-link{border:0;background:none;padding:4px 0;color:var(--blue,#1f5fae);font-weight:600;font-size:.85rem;cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-family:inherit}
.ph-box{border-radius:var(--r-m);overflow:hidden;background:var(--surface-3);min-height:120px;display:grid;place-items:center}
.ph-img{display:block;width:100%;max-height:65vh;object-fit:contain;background:#000}

.lab-top{display:flex;align-items:center;gap:10px;max-width:100%}
.lab-top .ltabs{flex:0 1 auto;min-width:0}
.lab-lock{flex-shrink:0;min-height:44px;padding:8px 14px;font-size:.9rem;gap:6px}
.lab-lock svg{width:18px;height:18px}
@media (max-width:520px){.lab-lock span{display:none}.lab-lock{padding:8px 11px}}
.ltabs button{flex-shrink:0;white-space:nowrap}
.wd-list{display:flex;flex-direction:column;gap:8px}
.wd-row{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.wd-row.off{opacity:.75;background:var(--surface-3)}
.wd-no{width:28px;height:28px;border-radius:50%;background:var(--surface-3);display:grid;place-items:center;font-weight:700;font-size:.85rem;flex-shrink:0;color:var(--muted)}
.wd-main{flex:1;min-width:0}.wd-main b{display:block;overflow-wrap:anywhere}
.wd-act{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
.wd-act .btn{min-height:40px;padding:6px 10px;font-size:.86rem}
.wd-act .ic{width:40px;padding:0}
.wd-add{display:flex;gap:8px;margin:4px 0 14px}.wd-add .input{flex:1;min-width:0}
@media (max-width:520px){.wd-row{flex-wrap:wrap}.wd-act{width:100%;justify-content:flex-start;padding-left:38px}}
.ltabs button{display:inline-flex;align-items:center;gap:8px;border:0;background:none;padding:10px 16px;border-radius:11px;font-weight:600;cursor:pointer;color:var(--muted);font-size:.95rem;transition:background .2s,color .2s}
.ltabs button svg{width:20px;height:20px}
.ltabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1),0 0 0 1px var(--line)}
.rng{display:flex;gap:4px;flex-wrap:wrap;align-items:center;background:var(--surface-3);border-radius:999px;padding:4px}
.rng button{border:0;background:none;border-radius:999px;padding:8px 16px;font-weight:600;cursor:pointer;color:var(--muted)}
.rng button[aria-pressed="true"]{background:var(--surface);color:var(--teal);box-shadow:var(--shadow-1)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:16px 18px;box-shadow:var(--shadow-1);display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .l{font-size:.82rem;color:var(--muted);font-weight:500}
.kpi .n{font-size:clamp(1.45rem,4.6vw,2.1rem);font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .n small{font-size:.9rem;font-weight:600;color:var(--muted);margin-left:4px;letter-spacing:0}
.kpi .s{font-size:.78rem;color:var(--muted)}
.kpi .sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:1px}
.kpi.warn{border-color:color-mix(in srgb,var(--warn) 45%,var(--line));background:var(--warn-soft)}.kpi.warn .n{color:var(--warn)}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:18px 18px 14px;box-shadow:var(--shadow-1);display:flex;flex-direction:column;gap:10px;min-width:0}
.ccard.full{grid-column:1/-1}
.ccard h3{font-size:1.02rem}
.ccard .sub{font-size:.8rem;color:var(--muted);margin-top:-6px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.plot{width:100%;position:relative}
.plot svg{display:block;width:100%;overflow:visible}
.plot text{font-family:var(--f-body);fill:var(--muted);font-size:11.5px}
.plot .val{fill:var(--ink);font-weight:600}
.plot .hit{fill:transparent;cursor:pointer}
.plot .col:hover .hl{opacity:1}
.hl{fill:color-mix(in srgb,var(--ink) 6%,transparent);opacity:0;transition:opacity .15s}
.hbars{display:flex;flex-direction:column;gap:10px}
.hrow{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:10px;align-items:center;font-size:.88rem;cursor:default;border-radius:8px;padding:2px 4px}
.hrow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.htrack{display:flex;gap:2px;height:16px;align-items:stretch}
.htrack i{display:block;border-radius:2px;min-width:3px}
.htrack i:last-child{border-radius:2px 4px 4px 2px}
.hrow b{font-variant-numeric:tabular-nums;min-width:2.5em;text-align:right}
.hrow:hover{background:var(--surface-2)}
details.tbl{font-size:.85rem}
details.tbl summary{cursor:pointer;color:var(--blue);font-weight:600;padding:4px 0}
details.tbl table{min-width:0;font-size:.85rem;margin-top:8px}
details.tbl th,details.tbl td{padding:6px 10px}
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--surface);font-size:.82rem;line-height:1.45;padding:8px 10px;border-radius:10px;box-shadow:var(--shadow-3);white-space:pre-line;max-width:220px;transform:translate(-50%,calc(-100% - 12px))}
.sk-kpi{height:96px}.sk-chart{height:240px}

/* ---------- motion ---------- */
@media (prefers-reduced-motion:no-preference){
  #app>*{animation:fadeUp .28s cubic-bezier(.2,.8,.2,1) both}
  .tick{animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
  .tick path{animation:draw .5s .2s ease-out both}
  .toast{animation:toastIn .25s ease both}
  .sheet{animation:sheetUp .28s cubic-bezier(.2,.8,.2,1) both}
  .sheet-ov{animation:fade .2s ease both}
  .btn:disabled::before{animation:spin .7s linear infinite}
  .sk{animation:sh 1.3s ease infinite}
  .pulse{animation:pulse 1.8s ease-out infinite}
  .lr.ready .ring2{animation:readyGlow 1.6s ease-in-out infinite}
  .undo .bar{animation:shrink 10s linear both}
  .bob{animation:bob 2.4s ease-in-out infinite}
  .bot .wave{animation:wave 1.4s ease-in-out infinite;transform-box:view-box;transform-origin:34px 100px}
  .bot .blink{animation:blink 4s infinite;transform-box:fill-box;transform-origin:center}
  .fab-say{animation:pop .5s cubic-bezier(.3,1.6,.5,1) both .4s}
}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes sheetUp{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sh{0%{background-position:100% 0}100%{background-position:0 0}}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes draw{from{stroke-dashoffset:30}to{stroke-dashoffset:0}}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--teal) 55%,transparent)}100%{box-shadow:0 0 0 10px transparent}}
@keyframes readyGlow{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--ok) 22%,transparent)}}
@keyframes shrink{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(16deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}

@media (min-width:900px){ .tabbar-in{max-width:620px} }
@media (max-width:760px){.kpis{grid-template-columns:1fr 1fr}.charts{grid-template-columns:1fr}}
@media (max-width:420px){.big b{font-size:1.04rem}.hero-t .nm{font-size:1.35rem}.brand .org{display:none}}
@media (max-width:360px){.row2{grid-template-columns:1fr}.hero-t{max-width:52%}}
</style>
</head>

async function uploadPhoto(id,dataUrl){
  const blob=await (await fetch(dataUrl)).blob();
  const d=new Date(),ymd=`${d.getFullYear()}${p2(d.getMonth()+1)}${p2(d.getDate())}`;
  const rnd=Array.from(crypto.getRandomValues(new Uint8Array(8)),x=>x.toString(16).padStart(2,'0')).join('');
  const path=`${ymd}/${id}-${rnd}.jpg`;
  const res=await fetch(`${SUPA_URL}/storage/v1/object/evidence/${path}`,{method:'POST',headers:supaHead({'Content-Type':'image/jpeg','x-upsert':'false'}),body:blob});
  if(!res.ok)throw new Error('upload '+res.status);
  await rpc('apiSetPhoto',[store.get(TOKEN_KEY),id,path]);
}

    const photo=args[1].photo,d=Object.assign({},args[1]);delete d.photo;

    if(r&&r.id){try{await uploadPhoto(r.id,photo)}catch(e){r.photoWarn=true}}

  if(fn==='apiCheckIn'&&args[1])args[1]=Object.assign({},args[1],{photo:undefined});

}

async function photoCrops(file){
  try{
    const img=await new Promise((ok,no)=>{const u=URL.createObjectURL(file),i=new Image();i.onload=()=>{URL.revokeObjectURL(u);ok(i)};i.onerror=no;i.src=u});

    for(const [fw,fh] of [[0.8,0.35],[0.6,0.25],[0.95,0.6]]){
      const cw=Math.round(W*fw),ch=Math.round(H*fh),sc=Math.min(2,1600/cw);
      const c=document.createElement('canvas');c.width=Math.round(cw*sc);c.height=Math.round(ch*sc);
      const g=c.getContext('2d');g.imageSmoothingEnabled=true;g.drawImage(img,(W-cw)/2,(H-ch)/2,cw,ch,0,0,c.width,c.height);
      const b=await new Promise(r=>c.toBlob(r,'image/jpeg',0.92));if(b)out.push(new File([b],'crop.jpg',{type:'image/jpeg'}));
    }
    return out;
  }catch(e){return []}
}

/* กรอก Sample No. แบบช่วย: เลือกวันที่บนสติกเกอร์ → ได้ 4 หลักแรก (วัน+เดือน) + 02 (Hemato) อัตโนมัติ แล้วพิมพ์อีก 4 หลักท้าย */
function bindSampleHelp(id){
  const btn=document.getElementById(id+'-help'),box=document.getElementById(id+'-sh'),main=document.getElementById(id);if(!btn)return;
  let day=null;
  const days=Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()-i);return d});
  const draw=()=>{
    const pre=day?`${p2(day.getDate())}${p2(day.getMonth()+1)}02`:'';
    box.innerHTML=`<div class="sh-warn">⚠️ เลือก<b>วันที่ที่พิมพ์อยู่บนสติกเกอร์สไลด์</b> ไม่ใช่วันนี้เสมอไป</div>
      <div class="sh-days">${days.map((d,i)=>`<button type="button" class="sh-day" data-i="${i}" aria-pressed="${!!day&&isoDate(day)===isoDate(d)}">${d.getDate()} ${TH_MON[d.getMonth()]}${i===0?'<small>วันนี้</small>':i===1?'<small>เมื่อวาน</small>':''}</button>`).join('')}
        <label class="sh-day sh-other">วันอื่น<input type="date" max="${isoDate(new Date())}" aria-label="เลือกวันที่บนสติกเกอร์"></label></div>
      <div class="sh-row"><span class="sh-pre mono" aria-label="เลข 6 หลักแรก">${pre?pre.replace(/(\d{2})(\d{2})(\d{2})/,'$1<i>$2</i>$3'):'วว ดด 02'}</span>
        <input class="input mono sh-last" inputmode="numeric" maxlength="4" placeholder="4 หลักท้าย" aria-label="เลข 4 หลักท้ายของ Sample No." ${day?'':'disabled'}></div>
      <div class="small muted">${day?`วันที่ ${day.getDate()} ${TH_MON[day.getMonth()]} → ขึ้นต้นด้วย ${pre} · พิมพ์ 4 หลักท้ายจากสติกเกอร์`:'เลือกวันที่ก่อน แล้วพิมพ์ 4 หลักท้าย'}</div>`;
    box.querySelectorAll('.sh-day[data-i]').forEach(b=>b.onclick=()=>{day=days[+b.dataset.i];draw();box.querySelector('.sh-last').focus()});
    const di=box.querySelector('.sh-other input');di.onchange=()=>{if(!di.value)return;const [y,m,d]=di.value.split('-').map(Number);day=new Date(y,m-1,d);draw();box.querySelector('.sh-last').focus()};
    const last=box.querySelector('.sh-last');
    last.oninput=()=>{last.value=last.value.replace(/\D/g,'').slice(0,4);
      if(day&&last.value.length===4){main.value=pre+last.value;main.dispatchEvent(new Event('input',{bubbles:true}));main.dispatchEvent(new Event('change',{bubbles:true}));
        box.hidden=true;btn.hidden=false;toast('ได้ Sample No. '+main.value+' แล้วครับ')}};
  };
  btn.onclick=()=>{box.hidden=false;btn.hidden=true;day=null;draw()};
}

/* ---------- ward combobox ---------- */
const wNorm=t=>String(t).toLowerCase().replace(/[()\[\]:,*\-/.]+/g,' ').replace(/\s+/g,' ').trim();
const wardRecent=()=>{try{return JSON.parse(localStorage.getItem('cbcRecentWards')||'[]')}catch(e){return []}};
const wardRecentAdd=w=>{try{localStorage.setItem('cbcRecentWards',JSON.stringify([w,...wardRecent().filter(x=>x!==w)].slice(0,5)))}catch(e){}};
function wardCombo(id,val,l){return `<div class="field"><label for="${id}">${L(l||'วอร์ด')}</label><div class="combo">
  <input class="input" id="${id}" role="combobox" aria-expanded="false" aria-controls="${id}-list" autocomplete="off" placeholder="พิมพ์ค้นหา เช่น อายุร, ICU, 9044" value="${esc(val||'')}">
  <ul class="combo-list" id="${id}-list" role="listbox" hidden></ul></div></div>`}
function bindCombo(id){
  const inp=document.getElementById(id),list=document.getElementById(id+'-list');let act=-1,items=[];
  const draw=()=>{const q=inp.value.trim();const recent=wardRecent().filter(w=>WARDS.includes(w));
    if(!q||WARDS.includes(q)){items=[...recent,...WARDS.filter(w=>!recent.includes(w))];}
    else{const toks=wNorm(q).split(' ').filter(Boolean);items=WARDS.filter(w=>{const n=wNorm(w),c=n.replace(/ /g,'');return toks.every(t=>n.includes(t)||c.includes(t))});
      const ph=toks.join(' ');items.sort((a,b)=>(wNorm(b).includes(ph)-wNorm(a).includes(ph))||(wNorm(b).startsWith(toks[0])-wNorm(a).startsWith(toks[0]))||(recent.includes(b)-recent.includes(a)))}
    const nr=(!q||WARDS.includes(q))?recent.length:0;
    list.innerHTML=items.length?items.map((w,i)=>(i===0&&nr?'<li class="combo-h" aria-hidden="true">ใช้ล่าสุด</li>':'')+(i===nr&&nr?'<li class="combo-h" aria-hidden="true">ทั้งหมด</li>':'')+`<li role="option" data-w="${esc(w)}" aria-selected="${i===act}">${esc(w)}</li>`).join(''):'<li class="muted">ไม่พบวอร์ดนี้ ลองพิมพ์คำอื่น หรือเลขโทรศัพท์วอร์ด</li>';
    const sel=list.querySelector('[aria-selected="true"]');if(sel)sel.scrollIntoView({block:'nearest'});
    list.hidden=false;inp.setAttribute('aria-expanded','true')};
  let armed=null,keep=false;
  const close=()=>{list.hidden=true;inp.setAttribute('aria-expanded','false');act=-1;armed=null};
  const pick=w=>{inp.value=w;wardRecentAdd(w);close();inp.dispatchEvent(new Event('change'))};
  // แตะครั้งแรก = เลือก (แถบสีเขียว) แตะซ้ำที่เดิม = ยืนยัน · เลื่อนรายการได้โดยไม่เลือกผิด
  const arm=li=>{list.querySelectorAll('li.armed').forEach(x=>{x.classList.remove('armed');x.removeAttribute('data-hint')});
    armed=li.dataset.w;li.classList.add('armed');li.setAttribute('data-hint','แตะอีกครั้งเพื่อยืนยัน')};
  inp.addEventListener('focus',()=>{inp.select();draw()});
  inp.addEventListener('input',()=>{act=-1;draw()});
  inp.addEventListener('keydown',e=>{if(e.key==='ArrowDown'){act=Math.min(act+1,items.length-1);draw();e.preventDefault()}
    else if(e.key==='ArrowUp'){act=Math.max(act-1,0);draw();e.preventDefault()}
    else if(e.key==='Enter'&&act>=0){pick(items[act]);e.preventDefault()}else if(e.key==='Escape')close()});
  list.addEventListener('mousedown',e=>e.preventDefault());           // ไม่ให้ช่องพิมพ์หลุดโฟกัสบนคอมพิวเตอร์
  list.addEventListener('pointerdown',()=>{keep=true});
  list.addEventListener('click',e=>{const li=e.target.closest('li[data-w]');if(!li)return;
    if(armed===li.dataset.w)pick(li.dataset.w);else arm(li)});
  inp.addEventListener('blur',()=>setTimeout(()=>{if(keep){keep=false;return}close()},200));
  document.addEventListener('pointerdown',e=>{if(!list.hidden&&!e.target.closest('.combo'))close()});
}

/* ---------- date + time of specimen ---------- */
const p2=n=>String(n).padStart(2,'0');
const isoDate=d=>`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
// Sample No. 10 หลัก: หลัก 1–2 = วันที่ทำสไลด์, 3–4 = เดือน (ไม่มีปี ใช้ปีปัจจุบัน ถ้าเกินวันนี้ถือเป็นปีก่อน)
function dateFromSample(s){
  if(!/^\d{10}$/.test(s))return '';
  const dd=+s.slice(0,2),mm=+s.slice(2,4);if(mm<1||mm>12||dd<1)return '';
  const now=new Date();let d=new Date(now.getFullYear(),mm-1,dd);
  if(d.getMonth()!==mm-1)return '';
  if(d.getTime()-now.getTime()>86400000)d=new Date(now.getFullYear()-1,mm-1,dd);
  return isoDate(d);
}
const thDate=iso=>{const [y,m,d]=iso.split('-');return `${+d}/${+m}/${+y+543}`};
const dayShift=n=>{const d=new Date();d.setDate(d.getDate()+n);return isoDate(d)};
function dtField(id,label){return `<div class="field"><span class="lab">${L(label)}</span>

    <button type="button" class="daychip" data-day="other">วันอื่น</button>
  </div>
  <input class="input" id="${id}-date" type="date" max="${isoDate(new Date())}" aria-label="เลือกวันที่ส่งตรวจ" hidden>
  <div class="small muted" id="${id}-dlabel"></div>
  <div class="hint" id="${id}-shint" hidden></div>
  <label class="lab" for="${id}-time" style="margin-top:4px">เวลาส่งตรวจ</label>
  <input class="input mono timein" id="${id}-time" type="text" inputmode="numeric" autocomplete="off" maxlength="5" placeholder="เช่น 0830">
  <div class="hint" id="${id}-hint">พิมพ์เวลาเป็นตัวเลข 4 ตัว เช่น 0830 = 08:30 น. · 2015 = 20:15 น.</div></div>`}
function getSpec(id){const dEl=document.getElementById(id+'-date'),tEl=document.getElementById(id+'-time');if(!dEl||!tEl)return '';const d=dEl.value,t=tEl.value;
  return d&&/^([01]\d|2[0-3]):[0-5]\d$/.test(t)?`${d}T${t}`:''}
function bindDT(id){
  const dIn=document.getElementById(id+'-date'),tIn=document.getElementById(id+'-time'),hint=document.getElementById(id+'-hint'),
    lab=document.getElementById(id+'-dlabel'),chips=[...dIn.parentElement.querySelectorAll('.daychip')];
  const sync=()=>{const v=dIn.value,t=dayShift(0),y=dayShift(-1);
    chips.forEach(c=>c.setAttribute('aria-pressed',c.dataset.day==='0'?v===t:c.dataset.day==='-1'?v===y:(!!v&&v!==t&&v!==y)||!dIn.hidden));
    lab.textContent=v?'วันที่ส่งตรวจ: '+thDate(v):'';};
  chips.forEach(c=>c.onclick=()=>{if(c.dataset.day==='other'){dIn.hidden=false;dIn.dataset.auto='';try{dIn.showPicker&&dIn.showPicker()}catch(e){};dIn.focus()}
    else{dIn.hidden=true;dIn.value=dayShift(+c.dataset.day);dIn.dataset.auto='';dIn.dispatchEvent(new Event('change'))}sync()});
  dIn.addEventListener('change',sync);dIn.addEventListener('input',sync);
  if(!dIn.value)dIn.value=dayShift(0);
  sync();
  // เวลา: พิมพ์ตัวเลข 4 ตัว ใส่ : ให้เอง
  const fmtT=()=>{let d=tIn.value.replace(/\D/g,'').slice(0,4);
    tIn.value=d.length===4?d.slice(0,2)+':'+d.slice(2):d;
    const ok=/^([01]\d|2[0-3]):[0-5]\d$/.test(tIn.value);
    tIn.classList.toggle('bad',d.length===4&&!ok);
    hint.textContent=d.length===4&&!ok?'เวลาไม่ถูกต้อง ชั่วโมง 00–23 นาที 00–59':ok?'เวลาส่งตรวจ '+tIn.value+' น.':'พิมพ์เวลาเป็นตัวเลข 4 ตัว เช่น 0830 = 08:30 น. · 2015 = 20:15 น.'};
  tIn.addEventListener('input',fmtT);
  tIn.addEventListener('blur',()=>{const d=tIn.value.replace(/\D/g,'');if(d.length===3){tIn.value='0'+d;fmtT();tIn.dispatchEvent(new Event('change'))}});
  if(tIn.value)fmtT();
}
/* หลัก 1–4 ของ Sample No. = วันที่ทำสไลด์ (ไม่ใช่วันส่งตรวจ) วันส่งตรวจจึงเป็นวันเดียวกัน หรือวันก่อนหน้าถ้าส่งตรวจตอนดึก */
const isoPrev=iso=>{const [y,m,d]=iso.split('-').map(Number);return isoDate(new Date(y,m-1,d-1))};
function bindSampleDate(sampleId,id){
  const s=document.getElementById(sampleId),dIn=document.getElementById(id+'-date'),sh=document.getElementById(id+'-shint');
  const note=()=>{const iso=dateFromSample(s.value.trim());if(!sh)return;
    if(!iso){sh.hidden=true;return}
    const ok=!dIn.value||dIn.value===iso||dIn.value===isoPrev(iso);
    sh.hidden=false;sh.className=ok?'hint':'hint warn-t';
    sh.textContent=ok?`Sample No. นี้ทำสไลด์วันที่ ${thDate(iso)} · ถ้าส่งตรวจตอนดึก วันส่งตรวจอาจเป็น ${thDate(isoPrev(iso))} ดูวันที่จริงจากใบตามอีกครั้ง`
      :`วันส่งตรวจไม่ตรงกับวันที่ทำสไลด์ (${thDate(iso)}) ปกติวันส่งตรวจเป็นวันเดียวกันหรือวันก่อนหน้า ตรวจอีกครั้ง`};
  dIn.addEventListener('input',()=>{dIn.dataset.auto='0'});

}

/* กติกาช่วงเวลาตาม Slide — ต้องตรงกับ RULE ใน Code.gs (ตามบันทึกข้อความ ทน.68/0909002 ทุกวอร์ด ไม่มีข้อยกเว้น) */
const RULE={dayFrom:'08:00',dayTo:'22:00',lateCut:'20:00',nextFrom:'08:00',nextTo:'14:00'};
function at(day,hhmm){const [y,m,d]=day.split('-').map(Number),[H,M]=hhmm.split(':').map(Number);return new Date(y,m-1,d,H,M)}
function followWindows(specIso){
  const [day,time]=specIso.split('T');const spec=at(day,time);
  const n=new Date(spec.getFullYear(),spec.getMonth(),spec.getDate()+1);const next=isoDate(n);
  const first={from:new Date(Math.max(spec,at(day,RULE.dayFrom))),to:at(day,RULE.dayTo)};
  const out=first.from<first.to?[first]:[];
  if(time>RULE.lateCut)out.push({from:at(next,RULE.nextFrom),to:at(next,RULE.nextTo)});
  return out;
}
const fmtDT=d=>`${p2(d.getDate())}/${p2(d.getMonth()+1)}/${d.getFullYear()} ${p2(d.getHours())}:${p2(d.getMinutes())}`;
const hm=d=>`${p2(d.getHours())}:${p2(d.getMinutes())}`;
const wTxt=ws=>ws.map(w=>`${fmtDT(w.from)} – ${hm(w.to)} น.`).join(' และ ');
function ruleHint(specIso){
  if(!specIso)return '';
  const ws=followWindows(specIso),now=Date.now(),last=ws[ws.length-1];
  const cur=ws.find(w=>now>=w.from&&now<=w.to);
  if(cur){const more=ws.filter(w=>w.from>cur.to);return `<div class="rule">ตามได้ถึง ${fmtDT(cur.to)} น.${more.length?` (และอีกช่วง ${wTxt(more)})`:''}</div>`}
  if(!last||now>last.to)return `<div class="rule bad">เกินกำหนดการตาม Slide แล้ว${ws.length?` (ตามได้ ${wTxt(ws)})`:''}</div>`;
  return `<div class="rule warn">ยังไม่ถึงเวลาตาม Slide ตามได้ช่วง ${wTxt(ws.filter(w=>now<w.from))}</div>`;
}

  const close=()=>{m.remove();document.removeEventListener('keydown',esc_)};

  m.querySelector('.modal-x').onclick=close;document.addEventListener('keydown',esc_);

  document.body.appendChild(m);m.querySelector('.modal-x').focus();
}

const REQUIRE_PHOTO=false; // ต้องตรงกับ Code.gs
// ย่อรูปให้ด้านยาวไม่เกิน 1280px แล้วแปลงเป็น JPEG (ประมาณ 150–300 KB)
function shrinkPhoto(file){return new Promise((res,rej)=>{
  const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{const k=Math.min(1,1280/Math.max(img.width,img.height));
    const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',0.72))};
  img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('อ่านรูปไม่ได้ ถ่ายใหม่อีกครั้ง'))};
  img.src=url;})}

let shotStream=null;
function closeShot(){const o=document.getElementById('shot-ov');if(o)o.hidden=true;if(shotStream){shotStream.getTracks().forEach(t=>t.stop());shotStream=null}}
async function openShot(onFile,fallback){
  let o=document.getElementById('shot-ov');
  if(!o){o=document.createElement('div');o.id='shot-ov';o.className='scan-ov';o.innerHTML=`<div class="scan-top"><span class="ttl">ถ่ายภาพหลักฐาน</span></div>
    <div class="shot-wrap"><video id="shot-v" playsinline muted autoplay></video><div class="shot-frame"></div></div>
    <div class="msg" id="shot-msg">ให้ใบตามอยู่ในกรอบ แล้วกดปุ่มถ่าย</div>
    <button class="shot-btn" id="shot-go" aria-label="ถ่ายภาพ"></button>
    <div class="row"><button class="btn btn-ghost" id="shot-alt">ใช้กล้องของเครื่องแทน</button><button class="btn btn-ghost" id="shot-x">ปิด</button></div>`;document.body.appendChild(o)}
  o.hidden=false;const v=o.querySelector('#shot-v'),msg=o.querySelector('#shot-msg'),go=o.querySelector('#shot-go');
  msg.textContent='กำลังเปิดกล้อง…';go.disabled=true;
  o.querySelector('#shot-x').onclick=closeShot;
  o.querySelector('#shot-alt').onclick=()=>{closeShot();fallback()};
  try{
    shotStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1440}},audio:false});
    v.srcObject=shotStream;await v.play().catch(()=>{});store.set('cbcCamOk','1');
    msg.textContent='ให้ใบตามอยู่ในกรอบ แล้วกดปุ่มถ่าย';go.disabled=false;
  }catch(e){closeShot();if(e&&e.name==='NotAllowedError'){camHelp('denied');return}fallback();return}
  go.onclick=()=>{if(!v.videoWidth)return;const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;
    c.getContext('2d').drawImage(v,0,0);go.disabled=true;o.classList.add('hit');
    c.toBlob(b=>{o.classList.remove('hit');closeShot();if(b)onFile(new File([b],'evidence.jpg',{type:'image/jpeg'}))},'image/jpeg',0.92)};
}
function bindPhoto(id,onChange){
  const inp=document.getElementById(id),box=document.getElementById(id+'-box');
  const handle=async f=>{if(!f)return;
    box.innerHTML='<div class="muted small">กำลังเตรียมรูป…</div>';
    try{const data=await shrinkPhoto(f);onChange(data);
      box.innerHTML=`<div class="photo-prev"><img src="${data}" alt="ภาพหลักฐานการส่งใบตาม"><div><div class="flag ok">ถ่ายภาพแล้ว</div><button type="button" class="linkbtn" data-take="${id}" style="display:inline-block;margin-top:6px">ถ่ายใหม่</button></div></div>`}
    catch(e){onChange('');box.innerHTML=`<div class="alert bad">${esc(e.message)}</div><button type="button" class="photo-take" data-take="${id}">${icCam}<span>ถ่ายใหม่</span></button>`}};
  inp.addEventListener('change',()=>{const f=inp.files[0];inp.value='';handle(f)});
  box.addEventListener('click',e=>{if(!e.target.closest('[data-take]'))return;e.preventDefault();
    if(camEnv()==='inapp'||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return inp.click();
    openShot(handle,()=>inp.click())});
}

  ${open.map(r=>{const left=Math.ceil((r.reqTs+span-now)/60000),ready=left<=0,p=Math.min(100,Math.max(2,(now-r.reqTs)/span*100));
    return `<button class="lr ${ready?'ready':''}" data-hn="${esc(r.hn)}" data-sample="${esc(r.sample)}">

  const sw=$('#nt-sw');if(sw)sw.onclick=async()=>{
    if(notifOn()){store.set(NOTIF_KEY,'0');return drawLive()}
    if(!('Notification' in window)){toast('มือถือเครื่องนี้ไม่รองรับการแจ้งเตือน แอปจะสั่นและมีเสียงแทนครับ');return}

      (navigator.serviceWorker&&navigator.serviceWorker.ready?navigator.serviceWorker.ready.then(r=>r.showNotification(msg,opt)):Promise.reject()).catch(()=>{try{new Notification(msg,opt)}catch(e){}})}}

     <span class="small muted">${thToday()}</span>${FEST&&FEST.chip?`<span class="fest-chip">${FEST.chip}</span>`:''}</div></section>
   <section class="panel live" id="live" hidden></section>
   <div class="cam-card" id="cam-card" hidden><div class="cam-i">📷</div><div class="cam-b"><b>เปิดใช้กล้องสำหรับสแกน</b><span class="cam-t small"></span></div>
     <button class="btn btn-teal" type="button">อนุญาตกล้อง</button></div>
   <div class="big-actions">
     <button class="big send" id="go-in">${icSend}<b>ส่งใบตาม Slide ที่ห้องแลป</b><span>นำใบตามสไลด์ (กระดาษ) มาส่งที่แลป แล้วบันทึกตอนส่ง</span></button>
     <button class="big recv" id="go-out">${icRecv}<b>บันทึกรับสไลด์</b><span>เจอสไลด์ที่ส่งใบตามไว้แล้ว</span></button>
     <button class="big inc" id="go-inc">${icInc}<span class="t"><b>บันทึกรับ Slide include</b><span>สไลด์ผู้ป่วยเด็ก / สไลด์ที่แพทย์ขอ include อยู่ในตะกร้า ไม่ต้องส่งใบตาม</span></span></button>
   </div>
   <div class="tools"><button class="help-btn" id="go-search">${icSearch}ค้นหาสถานะสไลด์</button>

   <div class="section-h"><h3>รายการล่าสุดของฉัน</h3><button class="linkbtn" id="refresh">รีเฟรช</button></div>
   <section class="panel" style="padding:6px 18px"><div class="mylist" id="mylist" aria-busy="true"><div class="sk sk-row"></div><div class="sk sk-row"></div><div class="sk sk-row"></div></div></section></div>`;
  $('#go-in').onclick=()=>{view='checkin';render()};

  $('#go-inc').onclick=()=>{view='include';render()};
  $('#go-help').onclick=showHelp;
  $('#go-search').onclick=()=>{view='search';render()};
  if(!guideShown){guideShown=true;showGuide()}
  const load=async()=>{try{const rows=await run('apiMine',store.get(TOKEN_KEY));if(!$('#mylist'))return;homeRows=rows;drawLive();
    $('#mylist').innerHTML=rows.length?rows.map(r=>`<div class="it ${r.status}"><div style="min-width:0"><div class="mono" style="font-weight:600">HN ${esc(r.hn)}${r.include?'<span class="tag-inc">Include</span>':''}</div>
      <div class="small muted">${r.sample?'Sample '+esc(r.sample)+' · ':''}${esc(r.ward)}</div>
      <div class="small muted">${r.status==='out'?'รับสไลด์ '+esc(r.recvAt):'ส่งใบตาม '+esc(r.reqAt)}</div>${photoBtn(r,'user')}</div>${pill(r.status)}</div>`).join(''):'<div class="empty"><div class="art sm">'+artSearch+'</div><div class="muted small">ยังไม่มีรายการ เมื่อบันทึกส่งใบตามหรือรับสไลด์ รายการจะขึ้นที่นี่</div></div>'}
