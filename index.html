}

/* ส่งใบตามสไลด์: บังคับ HN + วันเวลาส่งตรวจ + วอร์ด, Sample No. ไม่บังคับ */
function hardCard(r){
  return `<div class="dupcard" role="alert"><h3>Sample No. ของคนไข้ HN นี้ถูกส่งใบตามมาแล้ว</h3>
    <div class="small">ไม่ต้องบันทึกซ้ำ</div>
    <dl class="kv"><dt>HN</dt><dd class="mono">${esc(r.hn)}</dd><dt>Sample No.</dt><dd class="mono">${sampleTxt(r.sample)}</dd>
    <dt>วอร์ด</dt><dd>${esc(r.ward)}</dd><dt>วันเวลาส่งตรวจ</dt><dd>${esc(r.specAt||'–')}</dd>
    <dt>ส่งใบตามโดย</dt><dd>${esc(r.reqName)}</dd><dt>เวลาส่งใบตาม</dt><dd>${esc(r.reqAt)} <span class="small">(${ago(r.reqTs)}ที่แล้ว)</span></dd>
    <dt>สถานะ</dt><dd>${r.status==='out'?`รับสไลด์แล้ว โดย ${esc(r.recvName)} เมื่อ ${esc(r.recvAt)}`:'ยังไม่ได้รับสไลด์'}</dd></dl></div>`;
}
function softCard(recs,withBtn){
  return `<div class="dupcard" role="alert"><h3>HN นี้มีใบตามที่วันเวลาส่งตรวจใกล้กันอยู่แล้ว</h3>
    <div class="small">อาจเป็นการส่งใบตามซ้ำ ตรวจรายการด้านล่างก่อน</div>
    ${recs.slice(0,3).map(r=>`<dl class="kv"><dt>วันเวลาส่งตรวจ</dt><dd>${esc(r.specAt||'–')}</dd><dt>Sample No.</dt><dd class="mono">${sampleTxt(r.sample)}</dd>
      <dt>วอร์ด</dt><dd>${esc(r.ward)}</dd><dt>ส่งใบตามโดย</dt><dd>${esc(r.reqName)} · ${esc(r.reqAt)}</dd><dt>สถานะ</dt><dd>${STATUS[r.status]}</dd></dl>`).join('<hr style="border:0;border-top:1px solid rgba(0,0,0,.08);width:100%;margin:2px 0">')}
    ${withBtn?'<button type="button" class="btn btn-ghost" id="force">เป็นคนละรายการ บันทึกต่อ</button>':''}</div>`;
}
const icPaper='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>';
function vIn(){
  app.innerHTML=`<div class="col"><section class="panel accent-teal">${backHead('บันทึกส่งใบตามสไลด์')}
    <div class="alert paper">${icPaper}<div><b>ต้องนำใบตามสไลด์ตัวจริงมาส่งที่ห้องปฏิบัติการทุกครั้ง</b>แอปนี้ใช้บันทึกตอนส่งใบที่แลป ไม่ได้ใช้ส่งแทนใบ บันทึกจากวอร์ดไม่ได้</div></div>
    <form id="f" class="form" novalidate>
      ${hnField('q-hn','1. HN')}
      ${dtField('q','2. วันที่ส่งตรวจ')}
      ${scanField('q-sample','3. Sample No. <span class="opt">(ถ้ามี)</span>')}
      <div id="dup"></div>
      ${wardCombo('q-ward',store.get(WARD_KEY)||'','4. วอร์ด')}
      <div id="q-rule"></div>
      ${photoField('q-photo','5. ')}
      ${meBox('ผู้ส่งใบตาม')}
      <div class="hint">เวลาส่งใบตามจะบันทึกให้อัตโนมัติเมื่อกดยืนยัน</div>
      <label class="confirm-paper" id="q-paper-box"><input type="checkbox" id="q-paper"><span>ฉันนำ<b>ใบตามสไลด์ตัวจริง</b>มาส่งที่ห้องปฏิบัติการแล้ว</span></label>
      <div id="err"></div>
      <button class="btn btn-teal btn-block" type="submit" id="q-submit" aria-disabled="true">ยืนยันบันทึกส่งใบตาม</button>
    </form></section></div>`;
  bindScan('q-sample');bindCombo('q-ward');bindDT('q');bindSampleDate('q-sample','q');
  let photo='';bindPhoto('q-photo',d=>{photo=d;if(d)$('#err').innerHTML=''});
  if(carryIn){const c=carryIn;carryIn=null;setTimeout(()=>{const el=$('#q-sample');if(!el)return;el.value=c.sample||'';el.dispatchEvent(new Event('input',{bubbles:true}));if(c.hn)$('#q-hn').value=c.hn;$('#q-hn').focus()},0)}
  $('#back').onclick=()=>{view='home';render()};
  const sIn=$('#q-sample'),hIn=$('#q-hn');let seq=0,timer=null;
  const data=force=>({hn:hIn.value.trim(),sample:sIn.value.trim(),specAt:getSpec('q'),ward:$('#q-ward').value.trim(),force:!!force,photo});
  const check=async()=>{if(!document.getElementById('q-hn'))return;const d=data(),box=$('#dup');
    if(!d.hn||(!d.sample&&!d.specAt)){box.innerHTML='';return}
    const my=++seq;let r;try{r=await run('apiPrecheck',store.get(TOKEN_KEY),{hn:d.hn,sample:d.sample,specAt:d.specAt})}catch(e){return}
    if(my!==seq)return;
    box.innerHTML=r.hard?hardCard(r.hard):r.soft.length?softCard(r.soft,false):'';
    if((r.hard||r.soft.length)&&navigator.vibrate)navigator.vibrate([120,80,120]);};
  const later=()=>{clearTimeout(timer);timer=setTimeout(check,600)};
  const showRule=()=>{$('#q-rule').innerHTML=ruleHint(getSpec('q'),$('#q-ward').value.trim())};
  ['q-hn','q-sample','q-date','q-time'].forEach(id=>{const el=document.getElementById(id);el.addEventListener('input',later);el.addEventListener('change',later)});
  ['q-date','q-time','q-ward','q-sample'].forEach(id=>{const el=document.getElementById(id);el.addEventListener('input',showRule);el.addEventListener('change',showRule)});
  sIn.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('#q-ward').focus()}});
  const paper=$('#q-paper'),qs=$('#q-submit');
  paper.onchange=()=>{if(paper.checked){qs.removeAttribute('aria-disabled');$('#q-paper-box').classList.remove('need');$('#err').innerHTML=''}else qs.setAttribute('aria-disabled','true')};
  const submit=async(force,b)=>{$('#err').innerHTML='';
    if(!paper.checked){$('#q-paper-box').classList.add('need');$('#err').innerHTML=errBox('ติ๊กยืนยันว่านำใบตามสไลด์ตัวจริงมาส่งที่ห้องปฏิบัติการแล้ว ก่อนบันทึก');$('#q-paper-box').scrollIntoView({behavior:'smooth',block:'center'});return}
    if(REQUIRE_PHOTO&&!photo){$('#err').innerHTML=errBox('ถ่ายภาพหลักฐานการส่งใบตามก่อนบันทึก');$('#q-photo-box').scrollIntoView({behavior:'smooth',block:'center'});return}
    busy(b,true);
    try{const r=await run('apiCheckIn',store.get(TOKEN_KEY),data(force));
      if(r.dup==='hard'){$('#dup').innerHTML=hardCard(r.rec);$('#dup').scrollIntoView({behavior:'smooth',block:'center'});busy(b,false);return}
      if(r.dup==='soft'){$('#dup').innerHTML=softCard(r.recs,true);$('#dup').scrollIntoView({behavior:'smooth',block:'center'});busy(b,false);
        $('#force').onclick=()=>submit(true,$('#force'));return}
      store.set(WARD_KEY,r.ward);lastDone={kind:'in',r};view='done';render();if(r.photoWarn)toast('บันทึกแล้ว แต่ส่งรูปหลักฐานไม่สำเร็จ (ไม่เป็นไรครับ)')}
    catch(err){$('#err').innerHTML=errBox(err.message);busy(b,false)}};
  $('#f').onsubmit=e=>{e.preventDefault();submit(false,e.target.querySelector('button[type=submit]'))};
}

/* รับสไลด์: บังคับ Sample No. + HN (ไม่ต้องกรอกวันเวลาส่งตรวจ) */
function vOut(){
  app.innerHTML=`<div class="col"><section class="panel accent-blue">${backHead('บันทึกรับสไลด์')}
    <form id="f" class="form" novalidate>
      ${scanField('v-sample','1. Sample No. (จากสไลด์)')}
      ${hnField('v-hn','2. HN')}
      <div id="err"></div>
      <button class="btn btn-blue btn-block" type="submit">ค้นหาใบตาม</button>
    </form>
    <div id="v-card" class="form"></div></section></div>`;
  bindScan('v-sample');
  if(carryOut){const c=carryOut;carryOut=null;$('#v-sample').value=c.sample;$('#v-hn').value=c.hn}
  $('#back').onclick=()=>{view='home';render()};
  $('#v-sample').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('#v-hn').focus()}});
  const data=()=>({sample:$('#v-sample').value.trim(),hn:$('#v-hn').value.trim()});
  const card=(r,i,d,many)=>`<div class="check ${r.sampleOk&&r.dateOk!==false?'ok':''}">
      <div class="me"><span class="small muted">${many?'ใบตามที่ '+(i+1):'ใบตามที่พบ'}</span>${pill(r.status)}</div>
      <div class="ward-big">${esc(r.ward)}</div>
      <dl class="kv"><dt>HN</dt><dd class="mono" style="font-size:1.1rem;font-weight:600">${esc(r.hn)}</dd>
      <dt>วันเวลาส่งตรวจ</dt><dd style="font-size:1.1rem;font-weight:600">${esc(r.specAt||'–')}</dd>
      <dt>Sample No.</dt><dd class="mono">${r.sample?esc(r.sample):`<span class="muted">ยังไม่ระบุ</span>`}</dd>
      <dt>ส่งใบตามโดย</dt><dd>${esc(r.reqName)}</dd><dt>เวลาส่งใบตาม</dt><dd>${esc(r.reqAt)}</dd></dl>
      <div class="flags">
        ${r.sampleFill?`<div class="flag ok">ระบบจะบันทึก Sample No. ${esc(d.sample)} ลงใบตามนี้ให้</div>`:r.sampleOk?'<div class="flag ok">Sample No. ตรงกับใบตาม</div>':`<div class="flag bad">Sample No. ไม่ตรงกับใบตาม ห้ามหยิบ</div>`}
        ${r.dateOk===false?'<div class="flag warn">วันที่ทำสไลด์ (จาก Sample No.) ไม่ตรงกับวันส่งตรวจของใบตามนี้ ตรวจให้แน่ใจก่อนหยิบ</div>':r.dateOk&&r.sampleFill?'<div class="flag ok">วันที่ใน Sample No. ตรงกับวันส่งตรวจ</div>':''}
      </div>
      <div id="err-${i}"></div>
      ${r.sampleOk?`<button class="btn btn-blue btn-block" data-i="${i}">ยืนยันรับสไลด์ HN ${esc(r.hn)}</button>`:''}
    </div>`;
  $('#f').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button[type=submit]'),box=$('#v-card');
    const d=data();$('#err').innerHTML='';box.innerHTML='';
    if(!d.sample||!d.hn){$('#err').innerHTML=errBox('กรุณากรอก Sample No. และ HN ให้ครบครับ');return}
    busy(b,true,'กำลังค้นหา…');
    let res;try{res=await run('apiFindForReceive',store.get(TOKEN_KEY),d)}catch(err){$('#err').innerHTML=errBox(err.message);busy(b,false);return}
    busy(b,false);
    if(res.received){const r=res.received;box.innerHTML=`<div class="alert bad">สไลด์นี้ถูกรับไปแล้วครับ\nHN ${esc(r.hn)} · Sample No. ${esc(r.sample)}${r.specAt?' · ส่งตรวจ '+esc(r.specAt):''}\nรับโดย ${esc(r.recvName)} เมื่อ ${esc(r.recvAt)}</div>`;return}
    if(!res.open.length){box.innerHTML=`<div class="alert warn">ไม่พบใบตามที่ยังรอรับของ HN นี้ครับ\nถ้าเป็นสไลด์ผู้ป่วยเด็กหรือสไลด์ที่แพทย์ขอ include ให้ใช้ปุ่มสีม่วง "บันทึกรับ Slide include"</div>
      <button class="btn btn-violet btn-block" id="to-inc">ไปบันทึกรับ Slide include</button>
      <button class="btn btn-ghost btn-block" id="to-search">ค้นหาว่ามีคนรับไปแล้วหรือยัง</button>`;
      $('#to-search').onclick=()=>{searchQ=d.hn;view='search';render()};
      $('#to-inc').onclick=()=>{carry=d;view='include';render()};return}
    const many=res.open.length>1;
    box.innerHTML=(many?`<div class="alert info">HN นี้มีใบตามรอรับ ${res.open.length} ใบ\nกรุณาเลือกใบที่วันเวลาส่งตรวจตรงกับสไลด์ครับ (ใบที่น่าจะตรงที่สุดอยู่บนสุด)</div>`:'')+res.open.map((r,i)=>card(r,i,d,many)).join('');
    box.scrollIntoView({behavior:'smooth',block:'start'});
    box.querySelectorAll('button[data-i]').forEach(btn=>btn.onclick=async()=>{const r=res.open[+btn.dataset.i];busy(btn,true);
      try{const out=await run('apiCheckOut',store.get(TOKEN_KEY),{row:r.row,sample:d.sample,hn:d.hn});lastDone={kind:'out',r:out};view='done';render()}
      catch(err){$('#err-'+btn.dataset.i).innerHTML=errBox(err.message);busy(btn,false)}});
  };
}

/* รับ Slide include: ไม่ต้องส่งใบตามก่อน */
let carry=null,carryOut=null,carryIn=null;
function vInc(){
  app.innerHTML=`<div class="col"><section class="panel accent-violet">${backHead('บันทึกรับ Slide include')}
    <div class="alert info">สไลด์ผู้ป่วยเด็ก และสไลด์ที่แพทย์ขอ include ห้องปฏิบัติการจะวางไว้ในตะกร้าให้ หยิบแล้วบันทึกรับได้เลย ไม่ต้องส่งใบตาม</div>
    <button class="linkbtn" id="inc-search">หาในตะกร้าไม่เจอ? ค้นหาว่ามีคนรับไปแล้วหรือยัง</button>
    <form id="f" class="form" novalidate>
      ${scanField('i-sample','Sample No.')}
      ${hnField('i-hn')}
      ${wardCombo('i-ward',store.get(WARD_KEY)||'')}
      <div id="inc-warn"></div>
      ${meBox('ผู้รับสไลด์')}
      <div class="hint">เวลารับสไลด์จะบันทึกให้อัตโนมัติเมื่อกดยืนยัน</div>
      <div id="err"></div>
      <button class="btn btn-violet btn-block" type="submit">ยืนยันรับ Slide include</button>
    </form></section></div>`;
  bindScan('i-sample');bindCombo('i-ward');
  $('#back').onclick=()=>{view='home';render()};
  $('#inc-search').onclick=()=>{view='search';render()};
  if(carry){$('#i-sample').value=carry.sample;$('#i-hn').value=carry.hn;carry=null}
  $('#i-sample').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('#i-hn').focus()}});
  // ถ้าสไลด์นี้ส่งใบตามไว้แล้วและยังรอรับ ต้องไปบันทึกที่ปุ่มสีฟ้า "บันทึกรับสไลด์"
  const showPending=recs=>{const w=$('#inc-warn');if(!recs.length){w.innerHTML='';return false}
    const r=recs[0];
    w.innerHTML=`<div class="pending" role="alert"><h3>สไลด์นี้มีการส่งใบตามไว้แล้วครับ</h3>
      <div class="small">กรุณาบันทึกที่ปุ่มสีฟ้า <b>"บันทึกรับสไลด์"</b> แทนนะครับ ไม่ต้องบันทึกในช่อง Slide include</div>
      <dl class="kv"><dt>HN</dt><dd class="mono">${esc(r.hn)}</dd><dt>Sample No.</dt><dd class="mono">${sampleTxt(r.sample)}</dd>
      <dt>วอร์ด</dt><dd>${esc(r.ward)}</dd><dt>วันเวลาส่งตรวจ</dt><dd>${esc(r.specAt||'–')}</dd>
      <dt>ส่งใบตามโดย</dt><dd>${esc(r.reqName)} · ${esc(r.reqAt)}</dd></dl>
      <button type="button" class="btn btn-blue btn-block" id="to-out">ไปที่บันทึกรับสไลด์ (สีฟ้า)</button>
      <div class="small">หากแน่ใจว่าเป็นสไลด์ของการส่งตรวจคนละครั้ง กรุณาสอบถามห้องปฏิบัติการที่ <span class="call">8133</span> ครับ</div></div>`;
    $('#to-out').onclick=()=>{carryOut={sample:$('#i-sample').value.trim(),hn:r.hn,specAt:r.specAt};view='checkout';render()};
    w.scrollIntoView({behavior:'smooth',block:'center'});
    if(navigator.vibrate)navigator.vibrate([120,80,120]);return true};
  let seq=0,timer=null;
  const check=async()=>{const sample=$('#i-sample').value.trim(),hn=$('#i-hn').value.trim();
    if(!sample||!hn){$('#inc-warn').innerHTML='';return}
    const my=++seq;let r;try{r=await run('apiIncludeCheck',store.get(TOKEN_KEY),{sample,hn})}catch(e){return}
    if(my===seq)showPending(r.pending)};
  ['i-sample','i-hn'].forEach(id=>document.getElementById(id).addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(check,600)}));
  $('#f').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button[type=submit]');$('#err').innerHTML='';
    const d={sample:$('#i-sample').value.trim(),hn:$('#i-hn').value.trim(),ward:$('#i-ward').value.trim()};
    if(!d.sample||!d.hn){$('#err').innerHTML=errBox('กรุณากรอก Sample No. และ HN ให้ครบครับ');return}
    busy(b,true);

function openSheet(html){
  const ov=document.createElement('div');ov.className='sheet-ov';
  ov.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;
  const close=()=>{ov.remove();document.removeEventListener('keydown',k)};const k=e=>{if(e.key==='Escape')close()};
  ov.addEventListener('click',e=>{if(e.target===ov)close()});document.addEventListener('keydown',k);
  ov.querySelectorAll('[data-close]').forEach(b=>b.onclick=close);document.body.appendChild(ov);
  return {el:ov,close,set(h){ov.querySelector('.sheet').innerHTML='<div class="grab"></div>'+h;ov.querySelectorAll('[data-close]').forEach(b=>b.onclick=close)}};
}

const DOW=['อา.','จ.','อ.','พ.','พฤ.','ศ.','ส.'];
const dParse=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const dShort=k=>{const t=dParse(k);return t.getDate()+'/'+(t.getMonth()+1)};

const roundTop=(x,y,w,h,r)=>{r=Math.min(r,w/2,h);return `M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h}Z`};
/* กราฟแท่งแนวตั้ง: cols=[{label,tip,parts:[{v,c}]}] วาดตามความกว้างจริงของกล่อง ตัวหนังสือจึงไม่เล็กลงบนมือถือ */
function vbars(el,cols,o){
  const W=Math.max(260,el.clientWidth),two=cols.some(c=>String(c.label).includes('\n')),H=(o.h||210)+(two?14:0),L=34,R=16,T=18,B=two?38:24,pw=W-L-R,ph=H-T-B;
  const tot=c=>c.parts.reduce((a,p)=>a+p.v,0);
  const max=niceMax(Math.max(1,...cols.map(tot)));
  const step=pw/cols.length,bw=Math.max(2,Math.min(34,step*.64));
  let g='';
  [0,.5,1].forEach(f=>{const y=T+ph-ph*f;g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--grid)" stroke-width="1"/><text x="${L-6}" y="${y+4}" text-anchor="end">${nf(max*f)}</text>`});
  const peak=o.peak?cols.reduce((b,c,i)=>tot(c)>tot(cols[b])?i:b,0):-1;
  cols.forEach((c,i)=>{
    const x=L+i*step+(step-bw)/2;let y=T+ph,segs='';const t=tot(c);
    const vis=c.parts.filter(p=>p.v>0);
    vis.forEach((p,j)=>{let h=ph*p.v/max;const gap=j<vis.length-1?2:0;const last=j===vis.length-1;
      const yy=y-h;segs+=last?`<path d="${roundTop(x,yy,bw,Math.max(h,1),4)}" fill="${p.c}"/>`:`<rect x="${x}" y="${yy+gap}" width="${bw}" height="${Math.max(0,h-gap)}" fill="${p.c}"/>`;y=yy});
    const every=o.every*(o.narrowEvery&&W<480?o.narrowEvery:1);const isLast=o.last&&i===cols.length-1&&i%every>=every/2;
    const lab=every&&(i%every===0||isLast)?`<text x="${x+bw/2}" y="${H-(two?22:6)}" text-anchor="middle">${String(c.label).split('\n').map((t,j)=>`<tspan x="${x+bw/2}" dy="${j?14:0}">${esc(t)}</tspan>`).join('')}</text>`:'';
    const pk=i===peak&&t>0?`<text class="val" x="${x+bw/2}" y="${y-5}" text-anchor="middle">${nf(t)}</text>`:'';
    g+=`<g class="col"><rect class="hl" x="${L+i*step}" y="${T}" width="${step}" height="${ph}"/>${segs}${pk}${lab}<rect class="hit" data-tip="${esc(c.tip)}" x="${L+i*step}" y="0" width="${step}" height="${H}"/></g>`});
  el.innerHTML=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria)}">${g}</svg>`;
}

  <span class="htrack">${r.parts.filter(p=>p.v>0).map(p=>`<i style="width:${(p.v/max*100).toFixed(1)}%;background:${p.c}"></i>`).join('')}</span><b>${r.right}</b></div>`).join('')}</div>`}

      <li><span class="n">3</span><span>เลือก <b>ติดตั้งแอป</b> หรือ <b>เพิ่มลงในหน้าจอหลัก</b></span></li></ol>`}
    <div class="small muted">หลังติดตั้ง จะมีไอคอน "ตาม Slide" บนหน้าจอ เปิดแล้วเต็มจอเหมือนแอปทั่วไป</div>
    <button class="btn btn-teal btn-block" data-close>เข้าใจแล้ว</button>`)}
async function doInstall(){if(deferredInstall){deferredInstall.prompt();try{await deferredInstall.userChoice}catch(e){}deferredInstall=null}else installHelp()}
/* เมนู */
function openMenu(){
  const th=store.get(TH_KEY)||'auto',fs=store.get(FS_KEY)||'1.12',snd=store.get(SND_KEY)!=='0';
  const sh=openSheet(`
    ${ME?`<div style="display:flex;gap:12px;align-items:center"><div class="avatar">${esc(String(ME.nick).slice(0,2))}</div><div style="min-width:0"><b>${esc(ME.first)} ${esc(ME.last)}</b><div class="small muted">คุณ${esc(ME.nick)} · รหัส <span class="mono">${esc(ME.id)}</span></div></div></div>`:'<h2>เมนู</h2>'}
    <div class="field"><span class="lab">ขนาดตัวหนังสือ</span><div class="seg3">${[['1','ปกติ'],['1.12','ใหญ่'],['1.28','ใหญ่มาก']].map(([v,l])=>`<button data-fs="${v}" aria-pressed="${fs===v}">${l}</button>`).join('')}</div></div>
    <div class="field"><span class="lab">หน้าจอ</span><div class="seg3">${[['auto','ตามเครื่อง'],['light','สว่าง'],['dark','มืด']].map(([v,l])=>`<button data-th="${v}" aria-pressed="${th===v}">${l}</button>`).join('')}</div></div>
    <div class="menu-list">
      <button class="menu-it" id="m-snd">${icSound}เสียงเมื่อสแกนติด<span class="r"><span class="switch" aria-hidden="true" aria-checked="${snd}"></span></span></button>
      ${isStandalone()?'':`<button class="menu-it" id="m-install">${icInstall}ติดตั้งแอปลงหน้าจอมือถือ</button>`}
      <button class="menu-it" id="m-cam">📷&nbsp; อนุญาตกล้อง / แก้กล้องไม่ทำงาน</button>
      <button class="menu-it" id="m-guide">${icBook}วิธีการตาม Slide</button>
      <button class="menu-it" id="m-help">${icHelp}วิธีใช้งานแอป</button>
      <button class="menu-it" id="m-bot">${icChat}ถามน้องสไลด์</button>
      ${ME?`<button class="menu-it" id="m-logout">${icOut}ไม่ใช่ฉัน / ออกจากเครื่องนี้</button>`:''}
    </div>
    <button class="btn btn-soft btn-block" data-close>ปิด</button>`);
  const el=sh.el;
  el.querySelectorAll('[data-fs]').forEach(b=>b.onclick=()=>setFS(b.dataset.fs));
  el.querySelectorAll('[data-th]').forEach(b=>b.onclick=()=>applyTheme(b.dataset.th));
  el.querySelector('#m-snd').onclick=()=>{const on=store.get(SND_KEY)==='0';store.set(SND_KEY,on?'1':'0');el.querySelector('#m-snd .switch').setAttribute('aria-checked',on);if(on)beep()};
  const mi=el.querySelector('#m-install');if(mi)mi.onclick=()=>{sh.close();doInstall()};
  el.querySelector('#m-guide').onclick=()=>{sh.close();showGuide()};
  el.querySelector('#m-cam').onclick=async()=>{sh.close();const st=await camState();st==='denied'?camHelp('denied'):askCamera()};
  el.querySelector('#m-help').onclick=()=>{sh.close();showHelp()};
  el.querySelector('#m-bot').onclick=()=>{sh.close();openAssistant()};
  const lo=el.querySelector('#m-logout');if(lo)lo.onclick=()=>{sh.close();store.del(TOKEN_KEY);ME=null;mode='ward';view='login';render()};
}

/* ---------- ขออนุญาตใช้กล้อง (ให้ผู้ใช้กดยืนยันในแอป ไม่ต้องไปหาเมนูตั้งค่าเอง) ---------- */
const UA=navigator.userAgent;
const camEnv=()=>{
  if(/Line\/|FBAN|FBAV|FB_IAB|Instagram|Messenger|MicroMessenger/i.test(UA))return 'inapp';
  const ios=/iPad|iPhone|iPod/.test(UA)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  if(ios)return /CriOS/.test(UA)?'ios-chrome':/FxiOS|EdgiOS/.test(UA)?'ios-other':'ios-safari';
  if(/SamsungBrowser/.test(UA))return 'samsung';
  if(/Android/.test(UA))return 'android';
  return 'desktop'};
async function camState(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return 'unsupported';
  try{if(navigator.permissions&&navigator.permissions.query){const p=await navigator.permissions.query({name:'camera'});return p.state}}catch(e){}
  return store.get('cbcCamOk')==='1'?'granted':'prompt'}
async function askCamera(){
  if(camEnv()==='inapp')return camHelp('inapp');
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return camHelp('unsupported');
  try{const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
    st.getTracks().forEach(t=>t.stop());store.set('cbcCamOk','1');toast('เปิดใช้กล้องได้แล้วครับ สแกนบาร์โค้ดได้เลย 📷');
    const c=$('#cam-card');if(c)c.hidden=true;return true}
  catch(e){store.del('cbcCamOk');camHelp(e&&e.name==='NotAllowedError'?'denied':e&&e.name==='NotFoundError'?'nocam':'error');return false}}
const CAM_STEPS={
  'ios-safari':['กดปุ่ม <b>"AA"</b> หรือ <b>"ぁあ"</b> ที่ช่องลิงก์ (บนหรือล่างจอ)','เลือก <b>การตั้งค่าเว็บไซต์</b>','กด <b>กล้อง</b> แล้วเลือก <b>อนุญาต</b>','กลับมาที่แอป แล้วกดปุ่ม <b>ลองอีกครั้ง</b> ด้านล่าง'],
  'ios-chrome':['ออกจาก Chrome ไปที่ <b>การตั้งค่า</b> ของ iPhone','เลื่อนหา <b>Chrome</b> แล้วกดเข้าไป','เปิดสวิตช์ <b>กล้อง</b>','กลับมาที่แอป แล้วกดปุ่ม <b>ลองอีกครั้ง</b> ด้านล่าง'],
  'ios-other':['ไปที่ <b>การตั้งค่า</b> ของ iPhone','เลื่อนหาชื่อเบราว์เซอร์ที่ใช้อยู่ แล้วเปิดสวิตช์ <b>กล้อง</b>','หรือเปิดลิงก์แอปด้วย <b>Safari</b> แทน (แนะนำ)'],
  'android':['กด <b>ไอคอนหน้าลิงก์</b> (แม่กุญแจ / แถบปรับค่า) ซ้ายช่องลิงก์ด้านบน','กด <b>สิทธิ์</b> หรือ <b>การตั้งค่าเว็บไซต์</b>','กด <b>กล้อง</b> แล้วเลือก <b>อนุญาต</b>','ถ้าไม่มีให้เลือก: ตั้งค่าเครื่อง → แอป → Chrome → สิทธิ์ → กล้อง → อนุญาต','กลับมาที่แอป แล้วกดปุ่ม <b>ลองอีกครั้ง</b>'],
  'samsung':['กด <b>☰</b> มุมขวาล่าง → <b>การตั้งค่า</b>','<b>เว็บไซต์และการดาวน์โหลด</b> หรือ <b>ความเป็นส่วนตัว</b> → <b>สิทธิ์เว็บไซต์</b> → <b>กล้อง</b>','เลือกเว็บไซต์ของแอปนี้ แล้วกด <b>อนุญาต</b>','กลับมาที่แอป แล้วกดปุ่ม <b>ลองอีกครั้ง</b>'],
  'desktop':['กด <b>แม่กุญแจ</b> หรือ <b>ไอคอนปรับค่า</b> ซ้ายช่องลิงก์','ตั้ง <b>กล้อง</b> เป็น <b>อนุญาต</b> แล้วโหลดหน้าใหม่','ถ้าเครื่องไม่มีกล้อง ใช้เครื่องยิงบาร์โค้ดยิงลงช่องได้เลย']};
function camHelp(why){
  const env=camEnv();
  const top={inapp:'ตอนนี้เปิดแอปผ่าน LINE / Facebook ซึ่งใช้กล้องไม่ได้',denied:'เครื่องนี้ยังไม่อนุญาตให้แอปใช้กล้อง',nocam:'ไม่พบกล้องในเครื่องนี้',unsupported:'เบราว์เซอร์นี้ใช้กล้องไม่ได้',error:'เปิดกล้องไม่สำเร็จ'}[why]||'วิธีอนุญาตให้แอปใช้กล้อง';
  const steps=why==='inapp'?['กดปุ่ม <b>⋮</b> หรือ <b>แชร์</b> มุมขวาบน','เลือก <b>เปิดในเบราว์เซอร์</b> (iPhone: Safari · Android: Chrome)','ในเบราว์เซอร์ กดปุ่ม <b>อนุญาตกล้อง</b> อีกครั้ง']
    :why==='unsupported'?['iPhone ให้เปิดลิงก์แอปด้วย <b>Safari</b>','Android ให้เปิดด้วย <b>Chrome</b>']:(CAM_STEPS[env]||CAM_STEPS.android);
  const sh=openSheet(`<div class="eyebrow">กล้องสำหรับสแกนบาร์โค้ด</div><h2>${top}</h2>
    <ol class="cam-steps">${steps.map(t=>`<li>${t}</li>`).join('')}</ol>
    <div class="small muted" style="margin:6px 0 10px">ระหว่างนี้ยังพิมพ์เลขเองได้ หรือใช้ปุ่ม "📷 ถ่ายรูปบาร์โค้ด" ในหน้าสแกนได้ครับ</div>
    ${why==='inapp'?'':'<button class="btn btn-teal btn-block" id="cam-retry">ลองอีกครั้ง</button>'}
    <button class="btn btn-soft btn-block" data-close>ปิด</button>`);
  const r=sh.el.querySelector('#cam-retry');if(r)r.onclick=async()=>{sh.close();await askCamera()};
}
async function camCard(){const c=$('#cam-card');if(!c)return;const st=await camState();
  // iPhone ที่ตั้งกล้องเป็น "ถาม" จะกลับเป็น prompt ทุกครั้งที่เปิดแอป: ถ้าเครื่องนี้เคยอนุญาตสำเร็จแล้ว ไม่ต้องแสดงการ์ดซ้ำ
  if(st==='granted'||(st==='prompt'&&store.get('cbcCamOk')==='1')||!$('#cam-card'))return;
  c.hidden=false;c.querySelector('.cam-t').textContent=st==='denied'?'เครื่องนี้ยังไม่อนุญาตกล้อง กดเพื่อดูวิธีเปิด':'อนุญาตให้แอปใช้กล้องครั้งเดียว แล้วสแกนบาร์โค้ดได้ทันที';
  c.querySelector('button').onclick=()=>st==='denied'?camHelp('denied'):askCamera()}
/* แถบเมนูล่าง */
async function navTo(t){adminPin='';
  if(t==='menu')return openMenu();
  if(t==='scan'){if(!ME){mode='ward';view='register';render();toast('ลงทะเบียนก่อนใช้งานสแกนครับ');return}return quickScan()}
  if(t==='lab'){mode='lab';if(!labPin){try{labPin=sessionStorage.getItem('cbcLabPin')||''}catch(e){}}
    if(labPin){stopTimers();app.innerHTML='<div class="wide" aria-busy="true"><div class="sk" style="height:52px;width:320px;max-width:100%"></div><div class="kpis"><div class="sk sk-kpi"></div><div class="sk sk-kpi"></div></div><div class="sk sk-chart"></div></div>';try{labRows=await run('apiLabList',labPin)}catch(e){labPin=''}}
    return render()}
  mode='ward';if(!ME){view=view==='login'?'login':'register'}else view=t==='search'?'search':'home';render();
}
document.querySelectorAll('[data-tab-nav]').forEach(b=>b.onclick=()=>navTo(b.dataset.tabNav));
setInterval(()=>{if(mode==='lab'&&labPin&&labTab==='list'&&document.activeElement&&document.activeElement.id!=='lab-q')reloadLab()},60000);

run('apiInit',store.get(TOKEN_KEY)).then(d=>{WARDS=d.wards;ME=d.me;LATE_MIN=d.lateMin;if(d.fest){store.set('cbcFest',d.fest);applyFest(d.fest)}view=ME?'home':'register';render()})
  .catch(err=>{app.innerHTML=`<div class="col"><div class="alert bad">โหลดไม่สำเร็จ: ${esc(err.message)}</div></div>`});
})();
</script>
